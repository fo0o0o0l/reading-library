<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>手机复习阅读库</title>
<meta name="description" content="手机优先的复习阅读库：把项目里的学习资料收进一个随时能读的静态站点。">
<meta name="theme-color" content="#f3f5f8">
<meta name="asset-version" content="20261128e">
<script>(function(){try{var t=localStorage.getItem('reading-library-theme');if(!t){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="assets/library.css?v=20261128e">
</head>
<body>
<div id="loadbar"></div>

<header class="topbar">
  <div class="brand">
    <span class="mark">库</span>
    <span class="brand-name">手机复习阅读库</span>
  </div>
  <button class="theme-toggle" type="button" aria-pressed="false">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    <span class="theme-label">深色模式</span>
  </button>
</header>

<main>
  <section class="hero">
    <p class="eyebrow">Reading Library · 资料索引</p>
    <h1>手机复习阅读库</h1>
    <p class="hero-sub">为手机阅读准备的复习资料：点开即读，深浅色切换，移动流量下也能快速加载。</p>
    <div class="hero-pills">
      <span class="pill">共 <b id="stat-total">0</b> 份资料</span>
      <span class="pill"><b id="stat-tags">0</b> 个标签</span>
      <span class="pill">按加入时间排序</span>
    </div>
  </section>

  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
    <input id="search" type="search" placeholder="搜索标题、标签或关键词…" aria-label="搜索资料" autocomplete="off">
    <button class="search-clear" id="search-clear" type="button" aria-label="清空搜索">×</button>
  </div>

  <nav class="filters" id="filters" aria-label="按标签筛选"></nav>

  <p class="result-line" id="result-line" aria-live="polite"></p>

  <section class="list" id="list" aria-label="资料列表"></section>

  <div class="empty" id="empty">没有匹配的资料，换个关键词或标签试试。</div>

  <footer class="foot">
    <p><b>怎么看：</b>手机（含移动流量）直接访问公网地址 <a href="https://fo0o0o0l.github.io/reading-library/">fo0o0o0l.github.io/reading-library</a>；同一 Wi-Fi 下的本地预览仅用于发布前检查，详见 README。</p>
    <p><b>怎么加资料：</b>把文章放进 <b>notes/</b>，再到 <b>assets/notes-data.js</b> 里加一条记录即可，卡片、标签筛选和搜索会自动更新。</p>
  </footer>
</main>

<script src="assets/notes-data.js?v=20261128e"></script>
<script src="assets/library.js?v=20261128e"></script>
</body>
</html>
