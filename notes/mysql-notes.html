<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>MySQL 数据库操作笔记 · 九篇合集</title>
  <style>
    /* ======================== 主题与变量配置（One Dark） ======================== */
    :root {
      /* 背景层次：页面 → 卡片/侧栏 → 次级块 → 代码块 */
      --bg-page: #21252b;
      --bg-surface: #282c34;
      --bg-subtle: #2f343e;
      --bg-code: #1b1f27;
      /* 文字 */
      --text-primary: #dcdfe4;
      --text-secondary: #abb2bf;
      --text-muted: #8b919d;
      --border-color: #3b4048;
      /* One Dark 强调色 */
      --accent: #61afef;          /* 蓝：链接、导航、徽章 */
      --accent-fg: #1b1f27;       /* 强调色底上的文字 */
      --accent-soft: rgba(97, 175, 239, 0.14);
      --orange: #e5c07b;          /* 黄：注意/提示 */
      --orange-soft: rgba(229, 192, 123, 0.12);
      --green: #98c379;           /* 绿：正确/理解 */
      --green-soft: rgba(152, 195, 121, 0.12);
      --red: #e06c75;             /* 红：禁止/风险 */
      --red-soft: rgba(224, 108, 117, 0.13);
      --purple: #c678dd;          /* 紫：进阶/原理 */
      --purple-soft: rgba(198, 120, 221, 0.13);
      --code-inline: #d19a66;     /* 行内代码文字 */
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.42);
      --radius: 12px;
      --sidebar-width: 274px;
    }

    /* 备用浅色（One Light），点右上角切换 */
    [data-theme="light"] {
      --bg-page: #fafafa;
      --bg-surface: #ffffff;
      --bg-subtle: #f0f0f1;
      --bg-code: #282c34;
      --text-primary: #383a42;
      --text-secondary: #4b5263;
      --text-muted: #7f848e;
      --border-color: #e2e2e4;
      --accent: #4078f2;
      --accent-fg: #ffffff;
      --accent-soft: #eef2ff;
      --orange: #c18401;
      --orange-soft: #fdf6e3;
      --green: #50a14f;
      --green-soft: #edf7ed;
      --red: #e45649;
      --red-soft: #fdeceb;
      --purple: #a626a4;
      --purple-soft: #f8ecf8;
      --code-inline: #986801;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 6px 20px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    [hidden] { display: none !important; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.78;
      font-size: 15.5px;
      transition: background-color 0.25s, color 0.25s;
    }

    /* 顶部阅读进度条 */
    #reading-progress {
      position: fixed;
      top: 0; left: 0;
      height: 3px; width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--orange));
      z-index: 1000;
      transition: width 0.1s linear;
    }

    .container { max-width: 960px; margin: 0 auto; }

    /* ======================== 首页：封面 + 卡片墙 ======================== */
    .home-main { padding: 34px 38px 70px; }

    .theme-float {
      position: fixed;
      right: 22px; top: 20px;
      z-index: 950;
      padding: 8px 14px;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.18s;
    }

    .theme-float:hover { color: var(--accent); border-color: var(--accent); }

    .hero {
      background: linear-gradient(135deg, #313741 0%, #37404e 48%, #4a3f60 100%);
      color: var(--text-primary);
      padding: 32px 34px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-md);
      margin-bottom: 26px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(120% 80% at 88% 0%, rgba(198, 120, 221, 0.22), transparent 62%),
                  radial-gradient(90% 70% at 0% 100%, rgba(97, 175, 239, 0.16), transparent 60%);
      pointer-events: none;
    }

    .hero::after {
      content: attr(data-mark);
      position: absolute;
      right: 20px; bottom: -26px;
      font-size: 88px;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--accent);
      opacity: 0.14;
      pointer-events: none;
      line-height: 1;
    }

    .hero-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; position: relative; }

    .hero-tag {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(97, 175, 239, 0.16);
      color: #9ecbff;
      border: 1px solid rgba(97, 175, 239, 0.28);
    }

    .hero h1 { font-size: 28px; line-height: 1.3; margin-bottom: 10px; position: relative; }
    .hero p { font-size: 15px; max-width: 620px; color: var(--text-secondary); position: relative; }

    [data-theme="light"] .hero {
      background: linear-gradient(135deg, #f4f5f7 0%, #f7f4fb 48%, #eef3fb 100%);
    }
    [data-theme="light"] .hero-tag { background: rgba(64, 120, 242, 0.1); color: #4078f2; border-color: rgba(64, 120, 242, 0.22); }
    [data-theme="light"] .hero::after { color: var(--accent); opacity: 0.12; }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .entry-card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 20px 22px 19px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      color: inherit;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .entry-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent);
    }

    .entry-card:hover .entry-go { color: var(--accent); transform: translateX(3px); }

    .entry-top { display: flex; align-items: center; justify-content: space-between; }

    .entry-num {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--accent-fg);
      background: var(--accent);
      padding: 2px 9px;
      border-radius: 7px;
    }

    .entry-go {
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1;
      transition: color 0.18s, transform 0.18s;
    }

    .entry-card h3 { font-size: 16.5px; line-height: 1.45; color: var(--text-primary); }
    .entry-card p { font-size: 13.6px; line-height: 1.7; color: var(--text-secondary); flex: 1; }
    .entry-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }

    .home-footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 12.8px;
      padding: 26px 0 0;
    }

    /* 返回复习阅读库 */
    .lib-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 5px 12px;
      border-radius: 8px;
      text-decoration: none;
      margin-bottom: 14px;
    }

    .lib-back:hover { background: var(--accent); color: var(--accent-fg); }

    /* ======================== 阅读页：侧边栏 ======================== */
    .mobile-bar {
      display: none;
      position: sticky;
      top: 0; z-index: 800;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 14px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .mobile-bar strong {
      font-size: 13.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .menu-toggle {
      padding: 6px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-subtle);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
    }

    .layout { display: flex; min-height: 100vh; }

    .sidebar {
      position: fixed;
      top: 0; left: 0;
      width: var(--sidebar-width);
      height: 100vh;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      padding: 20px 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 900;
      transition: transform 0.25s ease, background-color 0.25s;
    }

    .brand { padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12.3px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 10px;
      border-radius: 8px;
      text-decoration: none;
      margin-bottom: 10px;
    }

    .back-btn:hover { background: var(--accent); color: var(--accent-fg); }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 2px 9px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .brand h1 { font-size: 16.5px; line-height: 1.4; color: var(--text-primary); }
    .brand p { font-size: 12.2px; color: var(--text-muted); margin-top: 3px; }

    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 3px; }

    .nav-list a {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6.5px 10px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 13.2px;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .nav-list a:hover { background: var(--bg-subtle); color: var(--accent); }
    .nav-list a.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }

    .nav-num {
      font-size: 11px;
      font-weight: 700;
      width: 20px; height: 20px;
      margin-top: 2px;
      border-radius: 6px;
      background: var(--bg-subtle);
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .nav-list a.active .nav-num { background: var(--accent); color: var(--accent-fg); }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .theme-btn {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-surface);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .theme-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ======================== 阅读页：主内容 ======================== */
    .main {
      margin-left: var(--sidebar-width);
      flex: 1;
      padding: 30px 38px 80px;
      max-width: calc(100% - var(--sidebar-width));
    }

    section.chapter {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 22px;
      box-shadow: var(--shadow-sm);
      scroll-margin-top: 20px;
    }

    .chapter-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--bg-subtle);
      flex-wrap: wrap;
    }

    .chapter-badge {
      background: var(--accent);
      color: var(--accent-fg);
      font-size: 13px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .chapter h2 { font-size: 21px; line-height: 1.4; color: var(--text-primary); }

    .chapter h3 {
      font-size: 16.5px;
      color: var(--text-primary);
      margin: 22px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chapter h3::before {
      content: "";
      display: inline-block;
      width: 4px; height: 16px;
      border-radius: 2px;
      background: var(--orange);
      flex-shrink: 0;
    }

    .chapter h4 { font-size: 15px; color: var(--text-primary); margin: 18px 0 8px; }

    .chapter p { margin-bottom: 12px; color: var(--text-secondary); }
    .chapter ul, .chapter ol { padding-left: 22px; margin-bottom: 14px; color: var(--text-secondary); }
    .chapter li { margin-bottom: 6px; }
    .chapter strong { color: var(--text-primary); }
    .chapter a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
    .chapter a:hover { border-bottom-color: var(--accent); }

    code {
      font-family: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
      font-size: 0.9em;
      background: var(--bg-subtle);
      color: var(--code-inline);
      padding: 2px 6px;
      border-radius: 5px;
    }

    /* 提示框 */
    .callout {
      padding: 13px 17px;
      border-radius: 10px;
      margin: 14px 0;
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      font-size: 14.3px;
      color: var(--text-secondary);
    }

    .callout.warn { border-left-color: var(--orange); background: var(--orange-soft); }
    .callout.good { border-left-color: var(--green); background: var(--green-soft); }
    .callout.danger { border-left-color: var(--red); background: var(--red-soft); }
    .callout.deep { border-left-color: var(--purple); background: var(--purple-soft); }

    .callout-title {
      font-weight: 700;
      color: var(--text-primary);
      display: block;
      margin-bottom: 3px;
      font-size: 13.8px;
    }

    /* 补充说明（原笔记里的“什么时候用”等短句） */
    .hint {
      font-size: 14.2px;
      color: var(--text-secondary);
      margin: 0 0 12px;
      padding: 9px 13px;
      background: var(--bg-subtle);
      border-radius: 8px;
    }

    .hint-label {
      display: inline-block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 1px 8px;
      border-radius: 999px;
      margin-right: 7px;
      vertical-align: 1px;
    }

    /* 胶囊标签 */
    .pill {
      display: inline-block;
      font-size: 11.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .pill.blue { background: var(--accent-soft); color: var(--accent); }
    .pill.green { background: var(--green-soft); color: var(--green); }
    .pill.red { background: var(--red-soft); color: var(--red); }
    .pill.orange { background: var(--orange-soft); color: var(--orange); }
    .pill.purple { background: var(--purple-soft); color: var(--purple); }

    /* 表格 */
    .table-wrap {
      overflow-x: auto;
      margin: 14px 0;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }

    th {
      background: var(--bg-subtle);
      color: var(--text-primary);
      font-weight: 700;
      padding: 10px 13px;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }

    td {
      padding: 10px 13px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-secondary);
      vertical-align: top;
    }

    tr:last-child td { border-bottom: none; }

    /* 代码块（One Dark 编辑器配色，两种主题下保持一致） */
    .code-block {
      position: relative;
      background: var(--bg-code);
      color: #abb2bf;
      border-radius: 10px;
      margin: 12px 0 16px;
      overflow: hidden;
      border: 1px solid #3b4048;
    }

    .code-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 14px;
      background: #21252b;
      border-bottom: 1px solid #3b4048;
      font-size: 11.5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #7f848e;
    }

    .copy-btn {
      background: #323842;
      border: none;
      color: #abb2bf;
      padding: 3px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 0;
      text-transform: none;
      transition: background 0.15s;
    }

    .copy-btn:hover { background: var(--accent); color: #1b1f27; }
    .copy-btn.done { background: var(--green); color: #1b1f27; }

    pre {
      padding: 14px 16px;
      overflow-x: auto;
      font-family: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
      font-size: 13.5px;
      line-height: 1.65;
    }

    pre code { background: transparent; color: inherit; padding: 0; font-size: inherit; }

    /* One Dark 语法色板 */
    .kw  { color: #c678dd; font-weight: 600; }   /* 关键字：紫 */
    .fn  { color: #61afef; }                     /* 函数名：蓝 */
    .str { color: #98c379; }                     /* 字符串：绿 */
    .num { color: #d19a66; }                     /* 数字：橙 */
    .cmt { color: #5c6370; font-style: italic; } /* 注释：灰 */

    .doc-footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 12.8px;
      padding: 6px 0 20px;
    }

    /* ======================== 响应式 & 打印 ======================== */
    @media (max-width: 1100px) {
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 960px) {
      .mobile-bar { display: flex; }
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); box-shadow: 0 0 40px rgba(0, 0, 0, 0.35); }
      .main { margin-left: 0; max-width: 100%; padding: 18px 14px 60px; }
      .home-main { padding: 20px 14px 50px; }
      .theme-float { display: none; }
      section.chapter { padding: 18px 16px; scroll-margin-top: 56px; }
      .chapter h2 { font-size: 19px; }
      .hero { padding: 24px 20px; }
      .hero h1 { font-size: 23px; }
      .hero::after { font-size: 64px; right: 14px; }
    }

    @media (max-width: 700px) {
      .cards { grid-template-columns: minmax(0, 1fr); }
    }

    @media print {
      .sidebar, .mobile-bar, #reading-progress, .copy-btn, .code-head, .theme-float { display: none !important; }
      .main, .home-main { margin-left: 0; max-width: 100%; padding: 0; }
      section.chapter { break-inside: avoid; box-shadow: none; }
      .entry-card { break-inside: avoid; }

      /* 打印时切成浅底，省墨且保证对照度 */
      :root {
        --bg-page: #ffffff; --bg-surface: #ffffff; --bg-subtle: #f4f4f5; --bg-code: #ffffff;
        --text-primary: #1a1a1a; --text-secondary: #333333; --text-muted: #666666;
        --border-color: #dddddd; --accent: #0b5f7a; --accent-fg: #ffffff;
        --accent-soft: #eef6f9; --code-inline: #8a4b00;
      }
      body { background: #fff; }
      .hero { background: #fff !important; border: 1px solid #ddd; color: #1a1a1a; }
      .hero::before, .hero::after { display: none; }
      .hero-tag { background: #f0f0f0; color: #333; border-color: #ddd; }
      .code-block { background: #fff; border-color: #ddd; color: #1a1a1a; }
      .kw { color: #8b3a9e; } .fn { color: #1c5fb8; }
      .str { color: #2f7a2f; } .num { color: #9a5a00; } .cmt { color: #777; }
    }
  </style>
</head>
<body>
  <!-- 阅读进度条 -->
  <div id="reading-progress"></div>

  <!-- ==================== 首页：卡片墙 ==================== -->
  <section id="view-home">
    <button class="theme-float" data-theme-toggle type="button">切换到深色</button>
    <main class="home-main">
      <div class="container">
        <a class="lib-back" href="../index.html">← 复习阅读库</a>
        <header class="hero" data-mark="MYSQL">
          <div class="hero-tags">
            <span class="hero-tag">9 篇合集</span>
            <span class="hero-tag">DDL / DML / DQL / DCL</span>
            <span class="hero-tag">函数 · 事务 · 约束 · 多表</span>
            <span class="hero-tag">离线单文件</span>
          </div>
          <h1>MySQL 数据库操作笔记</h1>

# 01 · DDL：数据定义

DDL（数据定义语言）管数据库的**结构**：建库、建表、加列、删表。它只搭骨架，不往表里放数据。

后面四份笔记共用一套示例：`students`（学生）、`courses`（课程）、`scores`（选课成绩）。

> SQL 关键字不区分大小写，`CREATE` 和 `create` 是同一件事；本文两种写法都会出现，自己写时同一份脚本里统一一种就好。

---

## 一、建库、切库

```sql
CREATE DATABASE IF NOT EXISTS school DEFAULT CHARACTER SET utf8mb4;
USE school;
```

执行结果：多出一个 `school` 库并切换进去，后面的建表都建在这里。

---

## 二、建表

```sql
CREATE TABLE students (
  student_id INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
  name       VARCHAR(20)  NOT NULL,
  gender     ENUM('男','女') NOT NULL DEFAULT '男',
  class_name VARCHAR(30)  NOT NULL,
  email      VARCHAR(100) UNIQUE
);

CREATE TABLE courses (
  course_id INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
  title     VARCHAR(50) NOT NULL UNIQUE,
  credit    DECIMAL(3,1) NOT NULL DEFAULT 2.0,
  teacher   VARCHAR(20) NOT NULL
);

CREATE TABLE scores (
  score_id   BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
  student_id INT UNSIGNED NOT NULL,
  course_id  INT UNSIGNED NOT NULL,
  score      DECIMAL(4,1),
  exam_date  DATE NOT NULL,
  UNIQUE KEY uk_stu_course (student_id, course_id),
  FOREIGN KEY (student_id) REFERENCES students (student_id)
);
```

执行结果：库里多出三张空表。`scores` 只能录入学号真实存在的学生，且同一学生的同一门课只能有一条记录。

---

## 三、查看表结构

```sql
show tables;      -- 列出库里所有的表
desc students;    -- 列出 students 的列名、类型、能否为空、主键
```

执行结果：第二条会显示 `student_id / name / gender / class_name / email` 五行，`Key` 列标出主键。

---

## 四、改表：加列、改列、删列

```sql
ALTER TABLE students ADD COLUMN phone VARCHAR(20);

ALTER TABLE students MODIFY COLUMN phone VARCHAR(30);

ALTER TABLE students CHANGE COLUMN phone mobile VARCHAR(30);

ALTER TABLE students DROP COLUMN mobile;
```

执行结果：依次新增 `phone` 列、改成 30 长度、改名为 `mobile`、再删掉这一列。

`MODIFY` 只能改属性，`CHANGE` 可以改名——但新名字和新定义要一起写全。

---

## 五、加索引

```sql
CREATE INDEX idx_class ON students (class_name);

CREATE INDEX idx_exam ON scores (exam_date);
```

执行结果：按班级查学生、按考试日期查成绩时会走索引，不用扫全表。

---

## 六、清空表、删表

```sql
TRUNCATE TABLE scores;   -- 清空所有行，表还在

DROP TABLE scores;       -- 连表结构一起删
DROP TABLE students;
```

执行结果：第一条把成绩清空、自增从 1 重新开始；后两条把表彻底删除。

删有外键关系的表要先删子表：先 `scores`，再 `students`。

| | `DELETE` | `TRUNCATE` | `DROP` |
| --- | --- | --- | --- |
| 删什么 | 符合条件的行 | 所有行，表保留 | 整张表 |
| 能带 `WHERE` | 能 | 不能 | 不能 |
| 能回滚 | 事务里能 | 不能 | 不能 |

---

## 七、坑点

- **`DROP` / `TRUNCATE` 删了就没了**，MySQL 没有回收站，`ROLLBACK` 也救不回来。执行前先备份：`mysqldump -u root -p school > school_backup.sql`。
- **忘了 `USE school;`**，表会建在你上一个所在的库里，之后在当前库 `SHOW TABLES` 怎么都找不到。
- **`CHANGE` 是整体替换**：漏写 `NOT NULL`、`DEFAULT` 这些属性，它们会被悄悄丢掉，不是"只改个名字"。
- **缩短 `VARCHAR` 会丢数据**：`VARCHAR(50)` 改成 `VARCHAR(10)`，严格模式下报 `ERROR 1406: Data too long`，非严格模式下直接截断。
- **`utf8` 存不了 emoji**：它实际是 3 字节的 `utf8mb3`，库和表统一用 `utf8mb4`。
- **`UNIQUE` 拦不住多个 `NULL`**：唯一索引允许多行该列为空，要非空必须写 `NOT NULL`。
- **外键建不上只报 `errno 150`**：两边字段类型、`UNSIGNED`、字符集必须完全一致，父表被引用列必须有索引。
- **大表 `ALTER TABLE` 会锁表**：改列类型通常要重建整张表，数据量大时别在业务高峰执行。
</script>
<script type="text/plain" data-doc="02">
# 02 · DML：数据操作

DML（数据操作语言）管表里的**数据**：`INSERT` 增、`UPDATE` 改、`DELETE` 删。它不改表结构。

示例沿用 [01-DDL-数据定义.md](01-DDL-数据定义.md) 建好的三张表：`students`、`courses`、`scores`。

> SQL 关键字不区分大小写，`INSERT` 和 `insert` 完全等价；本文两种写法都会出现，同一份代码里统一一种即可。

---

## 一、新增：`INSERT`

**骨架**

```sql
INSERT INTO 表名 (列1, 列2, ...) VALUES (值1, 值2, ...);
```

**单行**

```sql
insert into students (name, gender, class_name, email)
values ('张三', '男', '高一(1)班', 'zhangsan@example.com');
```

执行结果：表里多一行，`student_id` 自动填 1，没写的 `gender` 自动取默认值 `'男'`。

**多行**（推荐，一次插入比循环单插快很多）

```sql
INSERT INTO students (name, gender, class_name, email) VALUES
('李四', '女', '高一(1)班', 'lisi@example.com'),
('王五', '男', '高一(2)班', 'wangwu@example.com'),
('赵六', '女', '高一(2)班', NULL);
```

执行结果：又插入 3 行，学号依次是 2、3、4。

```sql
INSERT INTO courses (title, credit, teacher) VALUES
('数学', 4.0, '陈老师'),
('语文', 3.0, '林老师'),
('英语', 3.0, '黄老师'),
('物理', 2.0, '吴老师');

INSERT INTO scores (student_id, course_id, score, exam_date) VALUES
(1, 1, 92.5, '2026-06-20'),
(1, 2, 85.0, '2026-06-22'),
(1, 3, 78.5, '2026-06-24'),
(2, 1, 88.0, '2026-06-20'),
(2, 2, 95.0, '2026-06-22'),
(2, 4, NULL, '2026-06-26'),
(3, 1, 59.5, '2026-06-20'),
(3, 3, 66.0, '2026-06-24'),
(4, 2, 71.0, '2026-06-22'),
(4, 4, 83.5, '2026-06-26');
```

执行结果：4 门课、10 条成绩（第 6 条是李四的物理，还没出分，所以是 `NULL`）。后面的查询示例都基于这份数据。

---

## 二、修改：`UPDATE`

**骨架**

```sql
UPDATE 表名 SET 列1 = 新值, 列2 = 新值 WHERE 条件;
```

```sql
UPDATE students
SET email = 'wangwu_new@example.com'
WHERE student_id = 3;
```

执行结果：只有学号 3 的王五被改，返回 `Query OK, 1 row affected`；其他行不变。

---

## 三、删除：`DELETE`

**骨架**

```sql
DELETE FROM 表名 WHERE 条件;
```

```sql
-- 先插一条测试记录
INSERT INTO scores (student_id, course_id, score, exam_date)
VALUES (1, 4, 60.0, '2026-06-26');

-- 再按条件删掉它
DELETE FROM scores WHERE student_id = 1 AND course_id = 4;
```

执行结果：插入后变成 11 条，删除后回到 10 条，其他成绩一条没动。

整表清空用 `TRUNCATE`、连表一起删用 `DROP`，三者的区别见 01 末尾那张简表。

---

## 四、坑点

- **`UPDATE` / `DELETE` 忘写 `WHERE`**：改的就是整张表、删的就是所有行，而且没有任何确认提示。习惯是先用同样的 `WHERE` 跑一次 `SELECT`，确认行数再改。
- **`AND` 和 `OR` 混用不加括号**：`AND` 先算，`WHERE a = 'x' OR b = 'y' AND c > 0` 和你想的不是一回事，只要同时出现就加括号。
- **字符串不加引号**：`WHERE name = 张三` 会报 `Unknown column`，文字必须用单引号；`NULL` 反过来不能加引号，`'NULL'` 是四个字符的字符串。
- **`WHERE score = NULL` 永远查不到**：NULL 表示"未知"，和任何值比较都不成立，要用 `IS NULL`。
- **`UPDATE` 里改完值又拿它做条件**：`SET score = score + 5 WHERE score < 60` 是按旧值判断的，一行只加一次，不会反复累加。
- **一次插入太多行报错**：单条语句超过 `max_allowed_packet`（默认 64MB）会失败，按每批几百行拆分。
- **一次改/删上百万行会锁很久**：其他会话全被阻塞，用 `LIMIT` 分批处理，每批几千行。
- **外键报错要看数字**：插入不存在的学号是 `ERROR 1452`，删还被成绩引用的学生是 `ERROR 1451`。
- **自增 ID 不连续是正常的**：回滚、删除都会消耗编号，别拿它当业务单号；刚插入的 ID 用 `SELECT LAST_INSERT_ID()` 取。
</script>

# 03 · DQL：数据查询

DQL（数据查询语言）只有 `SELECT`：按条件把数据取出来，只读，不改动任何内容。

示例数据沿用 [02-DML-数据操作.md](02-DML-数据操作.md)：4 个学生、4 门课、10 条成绩（其中李四的物理成绩为 `NULL`）。

> SQL 关键字不区分大小写，`SELECT` 和 `select` 完全相同；本文统一用大写，自己写时同一份代码里统一一种即可。

---

## 一、基本查询

**操作语句**

```sql
SELECT [DISTINCT] 列名1, 列名2, ...
FROM 表名;
```

- `*` 表示取所有列，正式代码里尽量别用：表以后加一列，结果就多一列，按列位置取值的代码会错位。
- `DISTINCT` 对整行结果去重，写在所有列名之前。

**例子**

例 1：查询学生表的全部数据。

```sql
SELECT * FROM students;
```

执行结果：4 行 5 列。

例 2：只取姓名和班级两列。

```sql
SELECT name, class_name FROM students;
```

执行结果：4 行 2 列。

例 3：查看一共有哪些班级。

```sql
SELECT DISTINCT class_name FROM students;
```

执行结果：2 行，`高一(1)班`、`高一(2)班`。

---

## 二、条件查询

**操作语句**

```sql
SELECT 列名, ...
FROM 表名
WHERE 条件 [AND | OR 条件] ...;
```

常用运算符：

| 类别 | 写法 | 说明 |
| --- | --- | --- |
| 比较 | `=` `<>` `>` `<` `>=` `<=` | `<>` 即不等于 |
| 逻辑 | `AND` `OR` `NOT` | 与、或、非，`AND` 优先级高于 `OR` |
| 区间 | `BETWEEN 80 AND 90` | 含两端 |
| 集合 | `IN ('数学','语文')` | 等于其中任意一个 |
| 模糊 | `LIKE '张%'` | `%` 任意长度，`_` 一个字符 |
| 空值 | `IS NULL` / `IS NOT NULL` | 判断空值只能用 `IS`，不能用 `=` |

**例子**

例 1：查高一(1)班的学生。

```sql
SELECT name, class_name FROM students
WHERE class_name = '高一(1)班';
```

执行结果：2 行（张三、李四）。

例 2：查 1、2 号课程中 90 分及以上的成绩。

```sql
SELECT student_id, course_id, score FROM scores
WHERE course_id IN (1, 2) AND score >= 90;
```

执行结果：课程 1、2 里分数达到 90 的记录。

例 3：查姓张的学生，以及还没出成绩的记录。

```sql
SELECT name FROM students WHERE name LIKE '张%';

SELECT * FROM scores WHERE score IS NULL;
```

执行结果：第一条 1 行（张三）；第二条 1 行（李四的物理成绩为空）。

---

## 三、聚合函数

**操作语句**

```sql
SELECT 聚合函数(列名) [AS 别名], ...
FROM 表名
[WHERE 条件];
```

常用聚合函数：`COUNT()` 计数、`SUM()` 求和、`AVG()` 平均、`MAX()` 最大、`MIN()` 最小。

- `COUNT(*)` 统计行数；`COUNT(列名)` 会跳过该列的 `NULL`，统计行数一律用 `COUNT(*)`。
- 聚合函数会把多行压成一行，所以不能和普通列随便混着查（除非配合分组）。

**例子**

例 1：统计成绩条数和平均分。

```sql
SELECT COUNT(*) AS 记录数, ROUND(AVG(score), 2) AS 平均分
FROM scores;
```

执行结果：`10` 条记录，平均分 `79.89`。

例 2：查看最高分、最低分和总分。

```sql
SELECT MAX(score) AS 最高分, MIN(score) AS 最低分, SUM(score) AS 总分
FROM scores;
```

执行结果：一行三个汇总值，最高分为 `95.0`。

例 3：对比 `COUNT(*)` 与 `COUNT(列名)` 的差别。

```sql
SELECT COUNT(*) AS 总行数, COUNT(score) AS 有成绩行数
FROM scores;
```

执行结果：`10` 和 `9`，差的那一行就是李四的空成绩。

---

## 四、分组查询

**操作语句**

```sql
SELECT 分组列, 聚合函数(列名) AS 别名
FROM 表名
[WHERE 条件]
GROUP BY 分组列
[HAVING 分组后的条件];
```

- 分组列有几个，就按几个列组合分组；`SELECT` 里没被聚合的列必须出现在 `GROUP BY` 里，否则 MySQL 8 报 `ERROR 1055`。
- `WHERE` 筛的是分组前的行，`HAVING` 筛的是分组后的结果，所以 `AVG()` 这类聚合条件只能写在 `HAVING` 里。

**例子**

例 1：统计每个学生选了几门课、平均分多少。

```sql
SELECT student_id, COUNT(*) AS 选课数, ROUND(AVG(score), 2) AS 平均分
FROM scores
GROUP BY student_id;
```

执行结果：4 行 —— 学号 1 选 3 门均分 85.33、学号 2 选 3 门均分 91.50、学号 3 选 2 门 62.75、学号 4 选 2 门 77.25。

例 2：统计每门课的平均分，只要平均分不低于 80 的课。

```sql
SELECT course_id, ROUND(AVG(score), 2) AS 平均分
FROM scores
GROUP BY course_id
HAVING AVG(score) >= 80;
```

执行结果：只剩课程 1（80.00）和课程 2（83.67）。

例 3：先筛出及格成绩，再按课程统计。

```sql
SELECT course_id, COUNT(*) AS 及格人数, ROUND(AVG(score), 2) AS 平均分
FROM scores
WHERE score >= 60
GROUP BY course_id;
```

执行结果：每门课一行，只统计 60 分及以上的记录。

---

## 五、排序查询

**操作语句**

```sql
SELECT 列名, ...
FROM 表名
ORDER BY 列1 [ASC | DESC] [, 列2 [ASC | DESC]] ...;
```

- `ASC` 升序（默认，可省略），`DESC` 降序。
- 多列排序时，前一列相同才比较后一列。
- MySQL 中 `NULL` 升序排最前、降序排最后。
- `ORDER BY` 可以用 `SELECT` 里的别名，`WHERE` 不行。

**例子**

例 1：成绩从高到低排。

```sql
SELECT student_id, course_id, score FROM scores
ORDER BY score DESC;
```

执行结果：李四的 95.0 在最前，空成绩排在最后。

例 2：先按课程升序，同一门课内再按分数降序。

```sql
SELECT course_id, student_id, score FROM scores
ORDER BY course_id ASC, score DESC;
```

执行结果：课程 1 的记录排在前面，课程 2 随后，依此类推；同课程内分数高的在前。

例 3：按聚合结果的别名排序。

```sql
SELECT student_id, ROUND(AVG(score), 2) AS 平均分
FROM scores
GROUP BY student_id
ORDER BY 平均分 DESC;
```

执行结果：学号 2（91.50）、学号 1（85.33）、学号 4（77.25）、学号 3（62.75）。

---

## 六、分页查询

**操作语句**

```sql
SELECT 列名, ...
FROM 表名
ORDER BY 列名
LIMIT 每页条数 OFFSET 偏移量;

-- 等价写法：LIMIT 偏移量, 每页条数
```

- 偏移量 =（页码 − 1）× 每页条数。
- `LIMIT` 要配合 `ORDER BY`，否则每次返回的顺序不固定，翻页会出现重复或遗漏。
- 深分页很慢：`LIMIT 100000, 20` 要先数过 10 万行，可以改成按主键续查。

**例子**

例 1：取分数最高的前 3 条。

```sql
SELECT st.name, sc.score
FROM scores sc
JOIN students st ON st.student_id = sc.student_id
ORDER BY sc.score DESC
LIMIT 3;
```

执行结果：李四 95.0、张三 92.5、李四 88.0。

例 2：每页 3 条，取第 2 页。

```sql
SELECT student_id, course_id, score FROM scores
ORDER BY student_id, course_id
LIMIT 3 OFFSET 3;

-- 等价写法
-- LIMIT 3, 3
```

执行结果：跳过前 3 条，返回第 4～6 条。

例 3：大表翻页时按主键续查，避免数前 10 万行。

```sql
SELECT * FROM scores
WHERE student_id > 100
ORDER BY student_id
LIMIT 20;
```

执行结果：从 `student_id` 大于 100 的位置往后取 20 行，速度与页码无关。

---

## 七、编写顺序与执行顺序

**编写顺序**（你敲 SQL 时从上到下的顺序）

```sql
SELECT      -- 1. 要哪些列
FROM        -- 2. 从哪张表
JOIN        -- 3. 关联哪些表
WHERE       -- 4. 筛掉哪些行
GROUP BY    -- 5. 按什么分组
HAVING      -- 6. 筛掉哪些组
ORDER BY    -- 7. 怎么排序
LIMIT;      -- 8. 取多少条
```

**执行顺序**（数据库实际的处理顺序）

| 顺序 | 阶段 | 作用 |
| --- | --- | --- |
| 1 | `FROM` / `JOIN` | 确定数据来源，把表连起来 |
| 2 | `WHERE` | 逐行过滤，丢掉不满足条件的行 |
| 3 | `GROUP BY` | 把剩下的行按列分组 |
| 4 | `HAVING` | 过滤分组后的结果 |
| 5 | `SELECT` | 计算要输出的列、表达式和别名 |
| 6 | `DISTINCT` | 对结果去重 |
| 7 | `ORDER BY` | 排序 |
| 8 | `LIMIT` | 截取指定条数 |

对照记法：

```text
编写：SELECT → FROM → JOIN → WHERE → GROUP BY → HAVING → ORDER BY → LIMIT
执行：FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → DISTINCT → ORDER BY → LIMIT
```

**为什么要知道执行顺序**

- `WHERE` 在 `SELECT` 之前执行，所以 `WHERE` 里用不了 `SELECT` 起的别名，也用不了聚合函数；`ORDER BY` 在 `SELECT` 之后，所以能用别名。
- `HAVING` 在分组之后执行，所以 `AVG()`、`COUNT()` 这类聚合条件只能写在 `HAVING` 里，写在 `WHERE` 会报错。
- `LIMIT` 最后执行，所以它拿到的是排序后的结果，不写 `ORDER BY` 时取到哪几条并不固定。

---

## 附一、多表连接与子查询

**多表连接**

```sql
SELECT st.name, c.title, sc.score
FROM scores sc
JOIN students st ON st.student_id = sc.student_id
JOIN courses  c  ON c.course_id   = sc.course_id
ORDER BY st.student_id, c.course_id;
```

执行结果：10 行，每行是"谁、哪门课、多少分"，比如 `张三 | 数学 | 92.5`。

`JOIN` 只保留两边都能对上的行；`LEFT JOIN` 会保留左表的全部行，右表没匹配到的列填 `NULL`。

**子查询**

```sql
SELECT name FROM students
WHERE student_id IN (
  SELECT student_id FROM scores WHERE score >= 90
);
```

执行结果：张三、李四两行（他们的成绩里有 90 分以上的）。

---

## 附二、常见坑点

- **`COUNT(字段)` 会跳过 `NULL`**：本例 `COUNT(*)` 是 10，`COUNT(score)` 是 9。统计行数一律用 `COUNT(*)`。
- **`= NULL` 永远不成立**：`WHERE score = NULL` 返回 0 行，要用 `IS NULL`；`score <> 90` 也会漏掉成绩为空的行。
- **`NOT IN` 的列表里有 `NULL`**：`NOT IN (1, 2, NULL)` 恒不成立，一行都查不出来，改用 `NOT EXISTS`。
- **`LEFT JOIN` 的条件写错位置**：右表的过滤条件写在 `WHERE` 里，会把外连接退化成内连接，`NULL` 行全被筛掉；要保留左表就写到 `ON` 里。
- **`WHERE` 里用不了 `SELECT` 的别名**：`WHERE` 先于 `SELECT` 执行，别名还不存在；`ORDER BY` 可以用。
- **`GROUP BY` 漏列**：`SELECT` 里没有聚合的列必须出现在 `GROUP BY` 里，否则 MySQL 8 报 `ERROR 1055`。
- **`LIKE '%张%'` 很慢**：前导 `%` 用不上索引，只能全表扫描；数据量大时考虑全文索引。
- **深分页很慢**：`LIMIT 100000, 20` 要先数过 10 万行，改成 `WHERE id > 上一页最后一个 id ORDER BY id LIMIT 20`。
</script>
<script type="text/plain" data-doc="04">
# 04 · DCL：数据控制

DCL（数据控制语言）管账号和权限：谁能连接数据库、能对哪些表做什么。它不碰表结构，也不碰数据。

MySQL 里的账号是"用户名 + 来源主机"的组合，写成 `'用户名'@'主机'`，比如 `'report'@'%'` 表示任何机器都能用 `report` 登录。

> SQL 关键字不区分大小写，`GRANT` 和 `grant` 一样；本文两种写法都会出现，同一份脚本里统一一种即可。

---

## 一、建账号

```sql
CREATE USER 'report'@'%' IDENTIFIED BY 'Read@2026';
```

执行结果：多出一个账号，能登录，但没有任何数据权限（连查询都会被拒绝）。

---

## 二、授权：`GRANT`

**骨架**

```sql
GRANT 权限列表 ON 范围 TO '用户名'@'主机';
```

```sql
grant select on school.* to 'report'@'%';

GRANT SELECT, INSERT, UPDATE, DELETE ON school.students TO 'app'@'%';
```

执行结果：`report` 能查 `school` 库的所有表；`app` 只能对 `students` 这一张表增删改查（`app` 账号需先用 `CREATE USER` 建好）。

范围可以写得更粗或更细：`*.*` 所有库、`school.*` 整个库、`school.students` 单张表、`school.students(name)` 某一列。

---

## 三、查看权限

```sql
SHOW GRANTS FOR 'report'@'%';
```

执行结果：列出该账号的全部权限，其中 `GRANT SELECT ON school.*` 就是刚才授的；`USAGE` 表示"能登录但没有任何权限"。

---

## 四、收回权限：`REVOKE`

```sql
REVOKE SELECT ON school.* FROM 'report'@'%';
```

执行结果：查询权限立即失效，对方再查会报 `SELECT command denied`。

---

## 五、改密码、锁账号、删账号

```sql
ALTER USER 'report'@'%' IDENTIFIED BY 'NewRead@2026';  -- 改密码

alter user 'report'@'%' account lock;                   -- 锁定，暂时谁都不能登

ALTER USER 'report'@'%' ACCOUNT UNLOCK;                -- 解锁

DROP USER 'report'@'%';                                -- 删除账号
```

执行结果：依次修改密码、冻结账号、恢复账号、彻底删除账号（删除后新建的登录都会失败）。

---

## 六、坑点

- **MySQL 8 不能边授权边建号**：`GRANT ... IDENTIFIED BY ...` 的写法已被移除，会报 `ERROR 1064` 或 `ERROR 1410`；必须先 `CREATE USER` 再 `GRANT`。
- **`GRANT` 之后不需要 `FLUSH PRIVILEGES`**：授权、收权、建号都立即生效；只有你直接用 `UPDATE` 改了 `mysql.user` 这类授权表，才需要刷新。
- **账号是"用户名@主机"两条信息**：建了 `'app'@'%'` 不代表用 `-h localhost` 一定匹配得上，必要时单独建 `'app'@'localhost'`。
- **别给 `ALL PRIVILEGES ON *.*`，也别用 root 跑应用**：权限就是出事时的损失上限，业务账号只给需要的 `SELECT/INSERT/UPDATE/DELETE`。
- **权限只加不减**：时间一长没人说得清谁有 `DELETE` 权限，定期 `SHOW GRANTS` 巡检，离职称号先 `ACCOUNT LOCK` 再删。
- **直接改线上账号密码会让应用立刻断连**：连接池还在用旧密码，稳妥做法是新建账号、改配置、观察、再删旧账号。
- **老客户端连不上 8.0**：报 `Authentication plugin 'caching_sha2_password' cannot be loaded`，优先升级驱动。
- **`DROP USER` 不会踢掉已有连接**：已建立的会话往往还能继续用，删号后要配合停业务或 `KILL` 连接。
</script>

# 进阶补充：入门笔记之外，还会用到的这些

这里**不重复**四份精简笔记（01-DDL、02-DML、03-DQL、04-DCL）里已经写过的语法骨架和示例。只补它们没展开、但实际工作里迟早会碰到的点：建表时真正要选的参数、事务与存在则更新、连接类型与窗口函数、角色与权限粒度。

> SQL 关键字不区分大小写，`SELECT` 和 `select` 等价；本文两种写法都会出现，自己写时统一一种即可。

---

## DDL：结构层面的四个选择

~ 承接 [01-DDL-数据定义.md](01-DDL-数据定义.md)。精简版讲了怎么建表、加列、建索引；这里补"建的时候该选什么"和"还有哪两种结构对象"。

### 1.1 存储引擎与字符集：建表时真正要决定的参数

~ **什么时候用**：新建表、或接手一张不知道来历的老表时。

```sql
ALTER TABLE students
  ENGINE = InnoDB,
  CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
```

~ **引擎：**只用 `InnoDB`——它支持事务和外键，崩机能恢复；`MyISAM` 不支持事务，出问题容易丢数据。**字符集：**`utf8mb4` 才能存 emoji；`utf8mb4_0900_ai_ci` 里的 `ci` 表示比较时不区分大小写，`ai` 表示不区分重音，它决定了 `WHERE name = 'abc'` 能不能匹配到 `'ABC'`。

> **注意：**库、表、连接三处字符集不一致，是中文乱码最常见的原因。

### 1.2 外键的删除动作：不止"拦住"一种

~ **什么时候用**：两张表有从属关系，删主表数据前想好从表怎么办。

```sql
ALTER TABLE scores
  ADD CONSTRAINT fk_scores_course
  FOREIGN KEY (course_id) REFERENCES courses (course_id)
  ON DELETE CASCADE ON UPDATE CASCADE;
```

~ **`CASCADE`** 删课程时连带删掉它的成绩；**`RESTRICT`**（默认）只要还有成绩引用就禁止删；**`SET NULL`** 把从表外键置空（该列必须允许 NULL）。从属数据（成绩、订单明细）适合 `CASCADE`，主数据（课程、用户）适合 `RESTRICT`。

> **注意：**`CASCADE` 一处删除会波及多张表，删之前先 `SELECT` 确认范围。

### 1.3 CHECK 约束：把业务规则写进表里

~ **什么时候用**：分数范围、金额非负、状态只能取几个值——不想只靠代码校验时。

```sql
alter table courses
  add constraint chk_credit check (credit between 0 and 20);
```

~ 之后写入 `credit = 25` 会直接报 `ERROR 3819: Check constraint 'chk_credit' is violated`，坏数据进不来。MySQL **8.0.16 起**才真正执行 CHECK，更早的版本只解析不拦截。

### 1.4 视图：把常用查询存成一张"虚拟表"

~ **什么时候用**：三表关联天天写、或要给别人看数据但想藏掉某些列。

```sql
create view v_student_score as
select st.name, c.title, sc.score
from scores sc
join students st on st.student_id = sc.student_id
join courses  c  on c.course_id  = sc.course_id;
```

~ 之后像查表一样用它：`SELECT * FROM v_student_score WHERE score >= 90;`；删掉用 `DROP VIEW v_student_score;`。视图不存数据，每次查询都会重新执行那条 SELECT，所以嵌套层级别太深。

### 1.5 索引怎么选：复合索引看"最左前缀"

~ **什么时候用**：一条查询慢，想加索引，又怕加错、加多。

```sql
CREATE INDEX idx_class_gender ON students (class_name, gender);

EXPLAIN SELECT * FROM students WHERE class_name = '高一(1)班';
```

~ 这个索引能服务 `WHERE class_name = ?` 和 `WHERE class_name = ? AND gender = ?`，但**只查 gender 用不上**——复合索引从左往右匹配，跳过第一列就失效。用 `EXPLAIN` 看 `type` 和 `key` 是不是 `ref` 与索引名，别凭感觉判断。

> **注意：**索引越多，写入越慢、占盘越大；只给 WHERE / JOIN / ORDER BY 里真正用到的列建。

---

## DML：让多条写操作可控

~ 承接 [02-DML-数据操作.md](02-DML-数据操作.md)。精简版讲了单条增删改；这里补"一组操作怎么不出错"和三种更实用的写入形态。

### 2.1 事务：一组操作要么全成、要么全不算

~ **什么时候用**：转账、批量改分、任何"改一半出错会很麻烦"的场景。

```sql
start transaction;

update scores set score = score + 5 where score < 60;
delete from scores where score is null;

rollback;   -- 检查后不满意就回滚；确认无误改成 commit
```

~ 默认 `autocommit = 1`，单条语句敲下就生效；显式开事务后，只有 `COMMIT` 才真正落盘，`ROLLBACK` 能全部撤销。

> **注意：**`ALTER` / `DROP` 这类 DDL 会隐式提交当前事务，所以事务里不要混结构变更，否则你以为能回滚，其实早就提交了。

### 2.2 存在就更新：`ON DUPLICATE KEY UPDATE`

~ **什么时候用**：每天同步成绩、批量导入数据，同一个键可能已经存在。

```sql
insert into scores (student_id, course_id, score, exam_date)
values (1, 1, 95.0, '2026-06-20')
on duplicate key update
  score = values(score),
  exam_date = values(exam_date);
```

~ 它靠唯一索引 `(student_id, course_id)` 判断"已存在"：不存在就插入，存在就改成新值。返回 `2 rows affected` 表示命中并更新了 1 行，不是插了两条。

### 2.3 从查询结果插入：`INSERT ... SELECT`

~ **什么时候用**：归档旧数据、备份某个班、把 A 表的数据搬到 B 表。

```sql
CREATE TABLE students_bak LIKE students;

INSERT INTO students_bak (name, gender, class_name, email)
SELECT name, gender, class_name, email
FROM students
WHERE class_name = '高一(1)班';
```

~ 执行后 `students_bak` 里多出 1 班的 2 个学生。`CREATE TABLE ... LIKE` 只复制结构（含索引），不复制数据；`INSERT` 的列和 `SELECT` 的列要一一对应。

### 2.4 分批改、分批删：别用一个大事务锁住百万行

~ **什么时候用**：修历史数据、清理旧数据，一次影响几万行以上。

```sql
update scores set score = 60 where score is null limit 1000;

delete from scores where exam_date < '2026-01-01' limit 1000;
```

~ 每次只处理 1000 行，循环执行到"影响行数为 0"为止，批间稍作停顿。看返回的 `Rows matched` 判断还剩多少。一次改太多会产生巨大的 undo 日志，并长时间锁住这些行。

---

## DQL：连接、判存在、分类、排名

~ 承接 [03-DQL-数据查询.md](03-DQL-数据查询.md)。精简版讲了 SELECT、WHERE、分组和 JOIN 的基本写法；这里补连接的差别、另外两种子查询、以及"每行保留 + 组内排名"的思路。

### 3.1 四种连接到底差在哪

~ **什么时候用**：决定"匹配不上的行要不要保留"时。

| 写法 | 结果 |
| --- | --- |
| `INNER JOIN` | 只保留两边都能匹配上的行 |
| `LEFT JOIN` | 左表全保留，右表没匹配到的列填 `NULL` |
| `RIGHT JOIN` | 右表全保留；实际少用，调换表顺序写成 LEFT 更好读 |
| `CROSS JOIN` | 笛卡尔积，行数 = 两表行数相乘，多半是漏写了 ON |

```sql
select st.name, sc.score
from students st
left join scores sc
       on sc.student_id = st.student_id
      and sc.score >= 90;
```

~ 结果 4 行：张三 92.5、李四 95.0，王五和赵六的成绩列是 `NULL`。条件写在 `ON` 里才能保留左表；写到 `WHERE` 就退化成内连接了。

### 3.2 `EXISTS`：只关心"有没有"

~ **什么时候用**：判断关联表里是否存在满足条件的记录，尤其是 `NOT IN` 踩过 NULL 坑之后。

```sql
select name from students st
where exists (
  select 1 from scores sc
  where sc.student_id = st.student_id and sc.score < 60
);
```

~ 结果只有王五。子查询找到第一条就停止，`SELECT 1` 就够了；它不返回具体值，所以不会被 NULL 影响。

### 3.3 `CASE WHEN`：在结果里做分类

~ **什么时候用**：把分数翻译成等级、把状态码翻译成文字、做行列转换。

```sql
select st.name, sc.score,
  case
    when sc.score is null then '未出分'
    when sc.score >= 90 then '优秀'
    when sc.score >= 60 then '及格'
    else '不及格'
  end as 等级
from scores sc join students st on st.student_id = sc.student_id;
```

~ 从上往下匹配，命中第一个就返回。所以 `IS NULL` 必须放最前面，否则 NULL 会一路掉进 `ELSE`，被误判成"不及格"。

### 3.4 窗口函数：保留每一行，同时算组内排名

~ **什么时候用**：排名、组内占比、每组取第一条——这些用 GROUP BY 做不到，因为它会把多行压成一行。

```sql
select c.title, st.name, sc.score,
       rank() over (partition by sc.course_id order by sc.score desc) as 课程排名
from scores sc
join students st on st.student_id = sc.student_id
join courses  c  on c.course_id  = sc.course_id;
```

~ `PARTITION BY` 是分组，`ORDER BY` 是组内排序，每行都会得到一个名次。三个排序函数的区别：`ROW_NUMBER` 不并列，`RANK` 并列且跳号（1、1、3），`DENSE_RANK` 并列不跳号（1、1、2）。

~ "每组取第一条"的套路：把上面的查询包成派生表，再在外层筛 `WHERE rn = 1`；窗口函数不能直接写在 `WHERE` 里。

### 3.5 一条 SELECT 的真实执行顺序

~ **什么时候用**：想不通"为什么这里不能用别名/聚合函数"的时候。

```text
FROM / JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT
```

~ 你写的时候从 `SELECT` 开头，但数据库从 `FROM` 开始执行。所以 `WHERE` 里用不了 `SELECT` 起的别名（那时还没算出来），也用不了聚合函数（那时还没分组）；`HAVING` 在分组之后，所以两个都能用。

---

## DCL：权限的粒度与生效时机

~ 承接 [04-DCL-数据控制.md](04-DCL-数据控制.md)。精简版讲了建号、授权、收权；这里补"权限能细到什么程度""怎么批量管"和两个最常被误解的规则。

### 4.1 权限粒度：从整个实例到单独一列

~ **什么时候用**：同一个库，不同角色该看到的东西不一样时。

```sql
grant select (student_id, name, class_name)
  on school.students
  to 'service'@'%';
```

~ 四个层级：`*.*` 所有库（只给 DBA）、`school.*` 单库（业务账号）、`school.students` 单表（临时取数）、`school.students(name)` 单列（藏手机号、身份证）。

> **注意：**列级权限和 `SELECT *` 冲突——查所有列会直接报权限不足，必须显式写有权限的列。

### 4.2 角色：一组权限打包发给多个账号

~ **什么时候用**：十几个报表账号要同一套只读权限，一个个 GRANT 又累又容易漏。

```sql
create role 'role_readonly';

grant select on school.* to 'role_readonly';

grant 'role_readonly' to 'report'@'%';   -- report 账号需先用 CREATE USER 建好

set default role 'role_readonly' to 'report'@'%';
```

~ 角色本身也像一个账号，只是不能登录。以后加权限改角色就行，不用逐个账号改。

> **注意：**只 `GRANT` 角色而不 `SET DEFAULT ROLE`，角色默认是未激活状态，用户登录后权限不生效——看起来像授权失败了。

### 4.3 `FLUSH PRIVILEGES` 到底什么时候需要

~ **什么时候用**：只有一种情况：你绕过 SQL，直接改了授权表。

```sql
flush privileges;   -- 仅在直接 UPDATE mysql.user 之后需要
```

~ `GRANT`、`REVOKE`、`CREATE USER`、`DROP USER` 都是立即生效的，**不需要**它。网上大量"授权后记得 FLUSH"的说法是多余的；真正需要它的场景（手改 `mysql` 库）本身就不推荐。

### 4.4 主机位不是装饰：`'用户名'@'主机'`

~ **什么时候用**：建号时决定"允许从哪里连"，以及排查"账号建了却连不上"。

```sql
create user 'app'@'localhost' identified by 'App@2026';
create user 'app'@'192.168.1.%' identified by 'App@2026';
create user 'app'@'%' identified by 'App@2026';   -- 任何来源，谨慎使用
```

~ 同名不同主机是**三个独立账号**，权限各算各的。匹配时更具体的主机优先：本机连接会先找 `'app'@'localhost'`，不走 `'%'`；用 `-h 127.0.0.1` 连时匹配的又是另一条记录。

> **注意：**`'%'` 加上高权限等于把库暴露给整个网络，生产环境优先限定网段。
</script>
<script type="text/plain" data-doc="06">
# MySQL 函数学习笔记

> **一句话理解**：函数就是数据库自带的"加工工具"。把字段或者一个值丢进去，它返回加工后的结果，原来表里的数据不会被改（只有套在 `update` 里才会写回去）。

这篇对应项目里的 `01.函数操作` 四个脚本：`字符串函数.sql`、`数值函数.sql`、`日期函数.sql`、`流程控制函数.sql`。脚本里用的是 `fengling` 库，涉及到 `employee` 表，这里只用到它的四列：`workno`（工号）、`name`（姓名）、`workaddress`（工作地址）、`entrydate`（入职日期）。

---

## 一、字符串函数

对应 `01.函数操作\字符串函数.sql`。

| 函数 | 干什么 | 脚本里怎么写的 | 结果 |
| :--- | :--- | :--- | :--- |
| `concat` | 把几个字符串接在一起 | `select concat('hello','MySQL');` | `helloMySQL` |
| `lower` | 全部变小写 | `select lower('HELLO');` | `hello` |
| `upper` | 全部变大写 | `select upper('hello');` | `HELLO` |
| `lpad` | 左边补字符，补到指定总长度 | `select lpad('01',10,'-');` | `--------01` |
| `rpad` | 右边补字符，补到指定总长度 | `select rpad('01',10,'-');` | `01--------` |
| `trim` | 去掉首尾空格 | `select trim('  hello  world   ');` | `hello  world` |
| `substring` | 截取一段 | `select substring('hello mysql',1,5);` | `hello` |

三个注意点：

* `lpad` / `rpad` 的第二个参数是**补完以后的总长度**，不是"补几个"。`lpad('01',10,'-')` 是补到 10 位，所以补 8 个 `-`。
* `trim` 只去首尾，中间的空格不动，所以 `hello  world` 中间那两个空格还在。
* `substring` 的位置**从 1 开始数**，不是从 0。`substring('hello mysql',1,5)` 是从第 1 个字符开始取 5 个。

### 脚本里的实际用法：工号补零

```sql
-- 业务要求：员工工号统一 5 位数，不够的前面补 0
update employee set workno = lpad(workno,5,'0');
```

这条语句会对 `employee` 每一行执行一次：工号本来 3 位就补 2 个 0，本来 5 位就原样不动。`update` 配合函数，是函数真正"改数据"的地方；`select` 里的函数只是算给你看，不落库。

---

## 二、数值函数

对应 `01.函数操作\数值函数.sql`。这一组最简单，直接看语句和结果：

```sql
select ceil(1.1);            -- 2，向上取整，不管小数多少都往上进
select floor(1.8);           -- 1，向下取整，小数直接砍掉
select mod(7,4);             -- 3，取余数，7 ÷ 4 余 3
select rand();               -- 0 到 1 之间的小数，每次执行都可能不一样
select round(2.34567,2);     -- 2.35，四舍五入保留 2 位
select round(2.34367,2);     -- 2.34
```

`round` 的第二个参数是保留几位小数，写 0 就是取整。

### 脚本里的实际用法：生成六位随机验证码

```sql
select lpad(floor(rand()*1000000),6,'0');
select rpad(ceil(rand()*1000000),6,'0');
select lpad(round(rand()*1000000,0),6,'0');
```

拆开看就三步：

1. `rand()` 得到一个 0~1 的小数；
2. 乘 `1000000` 变成 0~999999 之间的数，再取整（`floor`、`ceil`、`round` 三种都行）；
3. 用 `lpad` 补到 6 位——因为随机数可能只有 1、2 位，比如算出来是 `123`，补完才是 `000123`。

这里正好把字符串函数和数值函数串起来用了，函数套函数是日常最普通的写法，不用害怕。

---

## 三、日期函数

对应 `01.函数操作\日期函数.sql`。

```sql
select curdate();   -- 今天日期，比如 2026-11-25
select curtime();   -- 当前时间，比如 13:54:00
select now();       -- 日期加时间，比如 2026-11-25 13:54:00
```

三个"取当前时间"的函数区别只在精度：只要日期用 `curdate`，只要时间用 `curtime`，两个都要用 `now`。

### 1. 取出年、月、日

```sql
select year(now());    -- 2026
select month(now());   -- 11
select day(now());     -- 25
```

返回的是数字，不是字符串，所以可以直接拿去比较大小。

### 2. 日期往后推、往前推

```sql
select date_add(now(),INTERVAL 70 day);    -- 70 天后的日期时间
select date_add(now(),INTERVAL 70 year);   -- 70 年后的日期时间
```

`INTERVAL 70 day` 里的单位可以换：`day`、`month`、`year` 都行。往前推就在数字前加负号，写成 `INTERVAL -70 day`，效果和 `date_sub` 一样。

### 3. 算两个日期差多少天

```sql
select datediff('2026-11-21','2026-12-21');   -- -30
select datediff('2026-12-21','2026-11-21');   -- 30
```

规则是**第一个减第二个**，所以顺序反了结果就是负数。只算"日期"差，不精确到时分秒。

### 4. 脚本里的实际用法：算员工入职天数

```sql
select name,
       datediff(curdate(),entrydate) as entrydays
from employee
order by entrydays desc;
```

`curdate()` 是今天，`entrydate` 是入职那天，今天减入职日就是入职天数。`as entrydays` 起了个别名，`order by` 才能直接用这个名字排序，按入职天数从多到少排。

---

## 四、流程控制函数

对应 `01.函数操作\流程控制函数.sql`。这一组的作用就是"按条件返回不同的值"，和我们写代码里的 `if`、`三元运算符` 是一个意思。

### 1. `if`：二选一

```sql
select if(true,'ok','error');   -- ok
```

三个参数：条件、条件为真返回什么、条件为假返回什么。它就是编程里的三元运算符 `条件 ? 真值 : 假值`。

### 2. `ifnull`：专门处理空值

```sql
select ifnull('','default');    -- 空字符串，原样返回
select ifnull('ok','default');  -- ok
select ifnull(null,'default');  -- default
```

第一个参数**只有真正是 `null` 才换**，空字符串 `''` 不算空，会原样返回。这个点很容易记错。

### 3. `case when then else end`：多分支

脚本里用两种写法做了同一件事——把工作地址翻译成城市等级：

```sql
-- 写法一：case 字段 when 值 then 结果
select
    name,
    (case employee.workaddress when '北京' then '一线城市' when '上海' then '一线城市' else '二线城市' end) as '工作地址'
from employee;

-- 写法二：用 if + in 达到同样效果
select
    name,
    (if(employee.workaddress in('北京','上海'),'一线城市','二线城市')) as '工作地址'
from employee;
```

`case 字段 when 值` 这种写法只能做**等值判断**（字段等于某个值）。要写 `>=`、`<` 这种范围判断，得把字段挪到 `when` 后面：

```sql
case
    when math >= 80 then '优秀'
    when math >= 60 then '及格'
    else '不及格'
end
```

### 4. 完整案例：给三科成绩打等级

脚本里先建了一张 `score` 表：

```sql
create table score(
    id int comment 'ID',
    name varchar(20) comment '姓名',
    math int comment '数学',
    english int comment '英语',
    chinese int comment '语文'
) comment '学员成绩表';

insert into score(id, name, math, english, chinese)
    values(1,'tom',67,78,97),
          (2,'marry',54,79,83),
          (3,'wangxuan',11,69,99),
          (4,'tongkan',66,79,10),
          (5,'fengling',100,91,98);
```

然后一条 `select` 把三门课都翻译成文字：

```sql
select
      id,
      name,
      (case when math >= 80 then '优秀' when math >= 60 then '及格' else '不及格' end) '数学',
      if(english>=80,'优秀',if(english>=60,'及格','不及格')) '英语',
      if(chinese>=85,'优秀',if(chinese>=60,'及格','不及格')) '语文'
from score;
```

看这段代码要抓三点：

* 数学用的是 `case when`，英语、语文用的是 `if` 套 `if`。两个分支用 `if` 够了，三个以上用 `case when` 更清楚。
* 分数线是三门课各写各的：数学 80、英语 80、语文 85。脚本开头的注释写的是">=85 优秀"，和代码对不上，**以代码为准**。
* 最后的 `'数学'`、`'英语'`、`'语文'` 是给结果列起别名，不写 `as` 也可以。

`case when` 的执行顺序是从上往下，**一旦某个 `when` 命中就直接返回，后面不再判断**。所以分数线要从高往低写，先写 80 再写 60；反过来先写 60，那 90 分也会被 60 那条抓住，变成"及格"。

---

## 五、聚合函数（常配合 `GROUP BY` 使用）

聚合函数和前面几组不一样：前面是一行进去一行出来，聚合是**多行进去一行出来**，用来做统计。

| 函数 | 作用 | 初学者易踩坑点 |
| :--- | :--- | :--- |
| `count(*)` / `count(col)` | 统计行数 | `count(*)` 统计所有行；`count(列名)` 会**忽略该列为 `null` 的行** |
| `sum(col)` | 求总和 | 自动忽略 `null` 值 |
| `avg(col)` | 求平均值 | 自动忽略 `null` 值（不会把 `null` 当 `0` 算） |
| `max(col)` / `min(col)` | 求最大值 / 最小值 | 也可用于日期和字符串比较 |

```sql
-- 按班级统计人数与平均分，且只保留平均分大于 75 的班级
select
    class_id,
    count(*) as 人数,
    round(avg(score), 1) as 平均分
from students
group by class_id
having avg(score) > 75;
```

几个要点：

* `group by` 后面写哪列，就是按哪列分组，一组算出一行结果；`select` 里没被聚合的列，必须出现在 `group by` 里。
* 分组后的过滤条件用 `having`，不能用 `where`。`where` 在分组前筛行，`having` 在分组后筛组。
* `avg` 算的是"非空值的平均"，不是"所有行的平均"。如果这一列有 `null`，分母会变小，算出来可能比你想的高。
* `count(列名)` 少算的行，就是这一列值为 `null` 的行；想统计总行数就用 `count(*)`。

---

## 六、进阶一点点

### 1. `concat` 碰上 `null` 会全军覆没

```sql
select concat('hello', null, 'mysql');   -- 结果是 null
```

`concat` 里只要有一个参数是 `null`，整个结果就是 `null`。要防止这种情况，先用 `ifnull` 兜一下：

```sql
select concat('hello', ifnull(null, ''), 'mysql');
```

### 2. `date_format`：把日期变成想要的格式

脚本里没写，但和日期函数是一套，很常用：

```sql
select date_format(now(), '%Y年%m月%d日');
```

`%Y` 四位年、`%m` 两位月、`%d` 两位日，中间可以夹任意文字。

### 3. 函数写在 `where` 里，索引可能用不上

```sql
-- 不推荐：entrydate 被 year() 包了一层，索引失效，只能全表扫描
select * from employee where year(entrydate) = 2026;

-- 推荐：把范围算出来直接比，索引能用
select * from employee where entrydate >= '2026-01-01' and entrydate < '2027-01-01';
```

规律是：`where` 条件左边的字段**光着**放，别包函数。函数套在右边的值上没关系。

### 4. 几个脚本外但好用的

| 函数 | 作用 | 例子 |
| :--- | :--- | :--- |
| `concat_ws(分隔符, ...)` | 用分隔符拼接，自动跳过 `null` | `concat_ws('-','2026','11','25')` → `2026-11-25` |
| `replace(原串, 旧, 新)` | 替换子串 | `replace('13800138000','00','**')` |
| `char_length(str)` | 字符个数（汉字算 1 个） | `char_length('你好MySQL')` → `7` |
| `abs(x)` | 绝对值 | `abs(-15)` → `15` |

---

## 七、几个容易踩的坑

* **`substring` 从 1 开始数**：写 `substring('abcdef',0,3)` 什么都取不到。
* **`lpad` 的第二个参数是总长度**：不是补几个；而且原串比目标长度还长时会**从右边截断**，`lpad('hello',3,'-')` 结果是 `hel`。
* **`datediff` 是第一个减第二个**：顺序写反结果是负数，不是报错，很容易看漏。
* **`ifnull` 只认 `null`**：`''`、`0` 都不算空，照样原样返回。
* **`if` 嵌套太多不好读**：超过三个分支就换 `case when`。
* **`case when` 从上往下命中就停**：范围判断要从大到小、从高到低写。
* **聚合函数不能直接写在 `where` 里**：`where count(*) > 10` 会报错，要用 `having`。
* **`select` 里用函数不改数据**：想让结果落库，得套进 `update`，像工号补零那条语句一样。

---

## 八、复习用：函数速查

| 分类 | 脚本里的函数 | 一条能记住的写法 |
| :--- | :--- | :--- |
| 字符串 | `concat`、`lower`、`upper`、`lpad`、`rpad`、`trim`、`substring` | `select lpad('01',10,'-');` |
| 数值 | `ceil`、`floor`、`mod`、`rand`、`round` | `select round(2.34567,2);` |
| 日期 | `curdate`、`curtime`、`now`、`year`、`month`、`day`、`date_add`、`datediff` | `select datediff(curdate(),entrydate) from employee;` |
| 流程控制 | `if`、`ifnull`、`case when` | `select if(true,'ok','error');` |
| 聚合 | `count`、`sum`、`avg`、`max`、`min` | `select count(*) from employee;` |

记不住的时候抓三条规律：

* **想加工一行里的某个值**：字符串、数值、日期、流程控制函数，随便套，套几层都行。
* **想把多行汇总成一行**：用聚合函数，大概率要配 `group by`，筛选用 `having`。
* **想让结果落地**：`select` 只是预览，真要改表得写 `update ... set 字段 = 函数(字段)`。
</script>
