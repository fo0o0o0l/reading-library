# MySQL 事务学习笔记

> **一句话理解**：事务就是把几条 SQL "打包"成一个整体，要么全部成功，要么全部作废——不能出现"钱扣了但没到账"这种做了一半的情况。事务只有 InnoDB 引擎支持（MySQL 8.0 默认就是 InnoDB）。

---

## 一、先看转账：为什么需要事务

张三给李四转 1000 元，数据库里要做两步：

1. 张三余额 `- 1000`
2. 李四余额 `+ 1000`

这两步必须绑在一起。如果第 1 步执行完，数据库突然断电、或者第 2 步报错，张三的钱扣了、李四却没收到，账就对不上了。有了事务，只要中间出错，就可以**回滚（`rollback`）**，把两步一起撤销，回到转账前的样子。

---

## 二、操作演示

对应项目里的 `04.事务\01_操作演示.sql`，演示的是上面这个转账。

### 1. 准备数据

```sql
create database itheima_02;
use itheima_02;

create table account(
    id int primary key auto_increment comment '主键id',
    name varchar(50) comment '名字',
    money int comment '余额'
) comment '账户表';

insert into account(name, money) values ('张三', 2000), ('李四', 2000);

-- 这行是"重置数据"，演示乱了就再执行一次，两个人又都回到 2000
update account set money = 2000 where name in ('张三', '李四');
```

建好之后两个人都是 2000，一共 4000。

### 2. 先看一眼自动提交开关

```sql
select @@autocommit;      -- 结果 1
set @@autocommit = 0;     -- 改成 0，当前窗口就不再自动提交了
```

`autocommit = 1` 是默认值，意思是每写一条 `insert/update/delete` 就立刻生效、立刻提交。改成 `0` 之后，这些语句就"悬"在那里：**你自己查得到变化，但没 `commit` 就不算数**，关掉窗口会自动回滚。

### 3. 方式一：关掉自动提交，手动 commit / rollback

```sql
-- 1. 查一下张三余额，2000
select money from account where name = '张三';

-- 2. 张三 -1000（执行完自己再查，是 1000）
update account set money = money - 1000 where name = '张三';

-- 3. 李四 +1000
update account set money = money + 1000 where name = '李四';

-- 4. 后悔了，回滚：两个人又回到 2000
rollback;

-- 5. 重新来一遍，这次确定没错了，提交
update account set money = money - 1000 where name = '张三';
update account set money = money + 1000 where name = '李四';
commit;   -- 提交后：张三 1000，李四 3000，这次真的改了
```

两个地方要留意：

* 两条 `update` 都执行了，为什么 `rollback` 一下像没发生过？因为它们都在同一个事务里，回滚是整个事务一起撤销。
* `commit` 之后就不能再 `rollback` 了，事务已经结束，再执行 `rollback` 什么也不干。想反悔必须在 `commit` 之前。

演示完记得把开关改回来，不然之后这个窗口所有语句都要自己提交：

```sql
set @@autocommit = 1;
```

### 4. 方式二：`start transaction`（平时用这个）

```sql
start transaction;   -- 开启事务，也可以写 begin;

select money from account where name = '张三';                        -- 2000
update account set money = money - 1000 where name = '张三';          -- 张三 1000
update account set money = money + 1000 where name = '李四';          -- 李四 3000

commit;    -- 两步都没问题，提交
-- rollback; -- 中间出错，回滚，全撤销
```

它和方式一的效果一样，区别是 `start transaction` 只管这一小段，`commit` / `rollback` 之后自动回到"自动提交"的状态，不用手动改开关。

| | 方式一 `autocommit = 0` | 方式二 `start transaction` |
| :--- | :--- | :--- |
| 管到哪 | 这个窗口后面**所有**语句 | 只管到 `commit` / `rollback` 为止 |
| 结束之后 | 还是手动模式，得自己改回 1 | 自动恢复自动提交 |
| 建议 | 容易忘，演示用 | 推荐，随用随开 |

### 5. 进阶：保存点 `savepoint`

一个事务很长时，可以插一个"存档点"，出错只退回存档点，前面的操作保住了：

```sql
start transaction;
update account set money = money - 100 where name = '张三';

savepoint sp1;                                         -- 存个档

update account set money = money - 5000 where name = '李四';  -- 这一步有问题

rollback to sp1;                                       -- 只撤销上面这一步，张三那 100 还在
commit;
```

---

## 三、四大特性（ACID）

| 特性 | 大白话 | 靠什么做到（了解即可） |
| :--- | :--- | :--- |
| **原子性** Atomicity | 事务要么全做完，要么全不做，没有"做一半" | 回滚日志 `undo log`：每改一行，先把旧值记下来，回滚照着旧值改回去 |
| **一致性** Consistency | 转账前后，两个人加起来的总钱数不变，数据始终合法 | 是目的，靠另外三个特性一起保证 |
| **隔离性** Isolation | 多个事务同时跑，互相不干扰，看不到对方没提交的东西 | 锁 + `MVCC`（多版本）：读的时候给你看一个快照，写的时候加锁 |
| **持久性** Durability | `commit` 之后数据就落盘了，断电重启也不会丢 | 重做日志 `redo log`：提交时先把改动记到日志并刷盘，重启后照着日志补 |

记的时候抓重点：**原子性管"全做或全不做"，一致性管"账要对得上"，隔离性管"并发别互相捣乱"，持久性管"提交了就不丢"**。

---

## 四、并发事务的三个问题

多个窗口同时操作同一批数据，就可能出下面三种问题。三个问题都是"**别人在中间动了手**"，区别在于动了什么：

| 问题 | 一句话 | 关键点 |
| :--- | :--- | :--- |
| **脏读** | 读到了别人**还没提交**的数据 | 别人后面一回滚，你读到的就是假数据 |
| **不可重复读** | 同一次事务里，同一行数据两次读出来**不一样** | 中间别人 `update` 并且提交了 |
| **幻读** | 同一次事务里，同样的条件两次查出来的**行数不一样** | 中间别人 `insert` 或 `delete` 并且提交了 |

拿账户表说：

* 脏读：张三明明还是 2000，另一个窗口改成 1000 还没提交，你就读到了 1000，结果人家回滚了，你拿着 1000 去做判断，全错。
* 不可重复读：你在一个事务里先查张三 2000，隔一会儿再查变成 3000，同一个事务里两次结果不一致。
* 幻读：你按 `money > 1500` 查出 2 条，过一会儿再查变 3 条，凭空多出来一行。

不可重复读和幻读容易混：**前者是同一行的内容变了，后者是行数变了。**

---

## 五、并发事务演示（要开两个窗口）

并发问题一个人演不出来，得开两个 MySQL 客户端窗口（下面叫**窗口 A**、**窗口 B**），让 A 查、B 改。项目里对应两个脚本，要分别放进两个窗口：

* `04.事务\02_并发事务演示及隔离级别_01.sql`：窗口 A（查询端），五个演示都从这里开始。
* `04.事务\03_并发事务演示及隔离级别_02.sql`：窗口 B（修改端），配合着改数据。

两个脚本按注释里标好的"第几步"来回切换执行，**在同一个窗口里从头跑到尾是演示不出来的**。窗口 B 保持默认的 `REPEATABLE READ` 就行，只负责改数据，这样才看得出窗口 A 设的级别起了什么作用。

### 1. 准备

两个窗口都先执行，把数据恢复成张三、李四各 2000：

```sql
use itheima_02;
update account set money = 2000 where name in ('张三', '李四');  -- 数据回到初始值
```

### 2. 演示一：脏读

窗口 A 设成 `read uncommitted`，允许自己读别人还没提交的数据：

```sql
-- ===== 窗口 A =====
set session transaction isolation level read uncommitted;   -- 只改当前窗口的隔离级别
start transaction;
select * from account;   -- 第1步：张三 2000
-- 第2步：去窗口 B 把张三改成 1000（不提交），再回来
select * from account;   -- 第3步：张三 1000 —— B 没提交也被读到了
-- 第4步：回窗口 B 执行 rollback，再回来
select * from account;   -- 第5步：又回到 2000，刚才读到的 1000 是脏数据
rollback;
```

```sql
-- ===== 窗口 B =====
start transaction;
update account set money = money - 1000 where name = '张三';   -- 改了，先不提交
-- 等窗口 A 做完第3步，再执行下面这句
rollback;                                                      -- 撤销，A 读到的 1000 是假的
```

脏读的关键：**读到的数据根本不算数**，B 一 `rollback`，A 手里那份就作废了。

### 3. 演示二：不可重复读

```sql
-- ===== 窗口 A =====
set session transaction isolation level read committed;   -- 改成"只能读已提交的"
start transaction;
select money from account where name = '张三';   -- 第1步：2000
-- 第2步：去窗口 B 把张三改成 3000 并提交，再回来
select money from account where name = '张三';   -- 第3步：3000 —— 同一个事务里变了
commit;
```

```sql
-- ===== 窗口 B =====
start transaction;
update account set money = 3000 where name = '张三';
commit;   -- 这次是真提交，A 在同一个事务里再查就变了
```

同一个事务里两次读同一行，结果不一样，就是不可重复读。

### 4. 演示三：幻读

```sql
-- ===== 窗口 A =====
set session transaction isolation level read committed;
start transaction;
select count(*) from account where money > 1500;   -- 第1步：2 条（张三 3000、李四 2000）
-- 第2步：去窗口 B 插入王五并提交，再回来
select count(*) from account where money > 1500;   -- 第3步：3 条 —— 多了一行
commit;
```

```sql
-- ===== 窗口 B =====
start transaction;
insert into account(name, money) values ('王五', 5000);
commit;   -- 多出来的一行就是"幻影"
```

同样的条件，行数从 2 变 3，多出来的那条就是"幻影"。

演示完把王五删掉，恢复原样：

```sql
delete from account where name = '王五';
```

### 5. 演示四：可重复读（默认级别）

这是对照实验：把演示二的事在默认级别下再做一遍。此时张三 3000。

```sql
-- ===== 窗口 A =====
set session transaction isolation level REPEATABLE READ;   -- 默认级别
start transaction;
select money from account where name = '张三';   -- 第1步：3000
-- 第2步：去窗口 B 把张三改成 3500 并提交，再回来
select money from account where name = '张三';   -- 第3步：还是 3000，事务里只看开始时的快照
commit;
select money from account where name = '张三';   -- 3500：提交后新事务才看得到
```

```sql
-- ===== 窗口 B =====
start transaction;
update account set money = 3500 where name = '张三';
commit;   -- 这次是真提交
```

同一个事务里两次查询结果一致，这就是"可重复读"。

### 6. 演示五：串行化

最严格的级别：A 的事务没结束，B 想改同一批数据只能排队等。

```sql
-- ===== 窗口 A =====
set session transaction isolation level serializable;
start transaction;
select * from account;   -- 第1步：查出来的行都被加上了锁
-- 第2步：去窗口 B 改李四余额，会看到 B 一直卡着不动
commit;                  -- 第3步：A 提交放锁，B 那句 update 立刻执行完
```

```sql
-- ===== 窗口 B =====
start transaction;
update account set money = money - 100 where name = '李四';   -- 会被锁住，等 A 提交
commit;
```

B 卡住不是报错，是在等锁；默认最多等 50 秒左右，超时才会报 `Lock wait timeout exceeded`，重跑一遍就行。

### 7. 为什么平时看不到这些现象

MySQL 默认的隔离级别是 `REPEATABLE READ`，一个事务从头到尾看的是同一份快照，所以演示二、三直接用默认级别跑，第二次查的结果都不会变——**必须先 `set session transaction isolation level ...` 把级别调下来才能演示出来**。

另外注意：隔离级别是**窗口级**的，A 窗口设成 `read committed`，B 窗口还是默认的 `repeatable read`，互不影响；而且只对之后新开的事务生效。

演示完把数据恢复一下（脚本末尾已经带了这一句）：

```sql
update account set money = 2000 where name in ('张三', '李四');
```

---

## 六、隔离级别

既然并发会出问题，隔离级别就是用来"压住"这些问题的，级别越高越安全、但越慢。上一节的五个演示正好把四个级别各过了一遍：演示一用 `read uncommitted`，演示二、三用 `read committed`，演示四用 `repeatable read`，演示五用 `serializable`。

| 隔离级别 | 脏读 | 不可重复读 | 幻读 | 说明 |
| :--- | :---: | :---: | :---: | :--- |
| `READ UNCOMMITTED`（读未提交） | 会发生 | 会发生 | 会发生 | 别人没提交的也能读到，最不安全，基本只用来做演示 |
| `READ COMMITTED`（读已提交） | 避免 | 会发生 | 会发生 | 只能读已提交的，Oracle / PostgreSQL 默认 |
| **`REPEATABLE READ`（可重复读）** | **避免** | **避免** | **基本避免** | **MySQL 默认级别，平时不用改** |
| `SERIALIZABLE`（串行化） | 避免 | 避免 | 避免 | 强制排队执行，最安全也最慢 |

```sql
-- 查看当前窗口的隔离级别（MySQL 8.0）
select @@transaction_isolation;

-- 查看全局默认值
select @@global.transaction_isolation;

-- 只改当前窗口，重开窗口就恢复默认（演示时用这个）
set session transaction isolation level read committed;

-- 改全局默认：只对之后新开的连接生效，已经开着的窗口不变
set global transaction isolation level read committed;
```

平时开发不用动它，默认的 `REPEATABLE READ` 已经够用，只有演示或者有特殊需求时才改。

---

## 七、几个容易踩的坑

* **`commit` 之后回滚不了**：事务已经结束，`rollback` 是空的。要撤销必须在 `commit` 之前。
* **`autocommit = 0` 忘了改回来**：之后这个窗口的语句都悬着不落库，看着像"改了又没了"；关掉窗口也会自动回滚。演示完执行 `set @@autocommit = 1;`。
* **建表、删表会顺手提交事务**：事务还没 `commit` 就执行 `create` / `alter` / `drop` / `truncate`，前面的修改会被一起提交掉，回滚不回来了。所以 DDL 别和业务 SQL 混在一个事务里。
* **只有 InnoDB 支持事务**：建表时引擎写成 `MyISAM`，`start transaction` 白开、`rollback` 也没用。用 `show create table account;` 看最后一行 `ENGINE=` 确认。
* **事务别开太久**：改过的行会被锁住，另一个窗口改同一行会一直等，等到超时报 `Lock wait timeout exceeded`。演示时两个窗口都别忘了 `commit` 或 `rollback`。
* **两个窗口要各设各的隔离级别**：`set session ...` 只影响执行它的那个窗口。

---

## 八、复习用：事务关键字速查

| 作用 | 语句 |
| :--- | :--- |
| 开启事务 | `start transaction;` 或 `begin;` |
| 提交事务 | `commit;` |
| 回滚事务 | `rollback;` |
| 设置保存点 | `savepoint sp1;` |
| 回滚到保存点 | `rollback to sp1;` |
| 关闭自动提交 | `set @@autocommit = 0;` |
| 打开自动提交 | `set @@autocommit = 1;` |
| 查看隔离级别 | `select @@transaction_isolation;` |
| 修改当前窗口隔离级别 | `set session transaction isolation level read committed;` |

记三句话就够：**开事务 → 干活 → 成功 `commit`、失败 `rollback`**；四大特性是 ACID；并发三个问题（脏读、不可重复读、幻读）靠隔离级别压住，MySQL 默认的可重复读基本能应付日常。
</script>
<script type="text/plain" data-doc="08">
# MySQL 约束学习笔记

> **一句话理解**：约束就是建表时给字段定的"规矩"。以后 `insert`、`update` 数据时，数据库先按规矩检查一遍，不合规矩就直接报错，数据存不进去。

---

## 一、常用的 6 种约束

| 约束 | 写法 | 规矩 |
| :--- | :--- | :--- |
| 主键 | `primary key` | 不能重复、不能为空，一张表只能有一个，常配 `auto_increment` 自增 |
| 非空 | `not null` | 这一列必须填值，不能留空 |
| 唯一 | `unique` | 这一列的值不能重复 |
| 默认值 | `default` | 插入时没写这一列，就自动填默认值 |
| 检查 | `check (条件)` | 值必须满足条件，比如年龄在 0~120 之间（MySQL 8.0.16 以后才真正生效） |
| 外键 | `foreign key` | 这一列的值必须在另一张表里查得到 |

两个容易记错的点：

* `unique` 只管"不重复"，**空值可以有好几条**；要"不重复且不能空"，得写成 `not null unique`。
* 主键自己就包含了"非空 + 唯一"，所以主键列不用再写 `not null`。

---

## 二、建表时直接加约束（`user` 表）

对应项目里的 `02.约束操作\约束演示.sql`：

```sql
use itheima;

create table user(
    id int primary key auto_increment comment '主键',     -- 主键，还带自增
    name varchar(10) not null unique comment '姓名',      -- 非空 + 唯一
    age int check (age > 0 && age < 120) comment '年龄',  -- 检查：年龄在 0~120
    status char(1) default '1' comment '状态',            -- 默认值 '1'
    gender varchar(5) comment '性别'
) comment '用户表';
```

逐列看一遍：

* `id`：主键 + 自增，插入时不用管它，数据库自己从 1 开始往上加。
* `name`：不能为空，也不能重名。
* `age`：只能填 0 到 120 之间的数（`&&` 就是 `and`，项目里用的是 `&&`）。
* `status`：插入时不写这一列，就自动填 `'1'`。
* `gender`：什么约束都没加，随便填。

### 插几条数据验证一下

```sql
-- 正常插入：id 不用写，自增
insert into user(name, age, status, gender) values ('Tom1', 19, '1', 'man'),
                                                   ('Tom2', 25, '0', 'man'),
                                                   ('Tom3', 22, '1', 'woman'),
                                                   ('Tom4', 27, '1', 'man');

-- 失败：name 为 null，违反非空
insert into user(name, age, status, gender) values (null, 16, '1', 'man');

-- 失败：已有 Tom3，违反唯一
insert into user(name, age, status, gender) values ('Tom3', 16, '1', 'man');

-- 失败：年龄 -1 超出 0~120（上一句已经插过 Tom5，这条同时也重名了）
insert into user(name, age, status, gender) values ('Tom5', -1, '1', 'man');

-- 成功：没写 status，自动填默认值 '1'
insert into user(name, age, gender) values ('Tom6', 46, 'man');
```

约束的作用就是这几次失败：数据根本没进库，不用等程序后面再去查错。

---

## 三、表建好了，怎么加、怎么删

语法都是 `alter table 表名 ...`，改的是表结构，不会去改表里已有的数据。

### 1. 主键

```sql
-- 加主键
alter table user add primary key (id);

-- 删主键：主键带自增的话，先去掉自增，否则删不掉
alter table user modify id int;
alter table user drop primary key;
```

### 2. 非空

```sql
-- 加非空（modify 是把整列重新定义一遍，类型要照着原来的写）
alter table user modify name varchar(10) not null;

-- 删非空：把 not null 换成 null
alter table user modify name varchar(10) null;
```

### 3. 唯一

```sql
-- 加唯一，顺便自己起个名字 uk_name
alter table user add constraint uk_name unique (name);

-- 删唯一
alter table user drop index uk_name;
```

建表时如果像 `name varchar(10) not null unique` 这样没起名字，MySQL 会直接拿列名 `name` 当索引名，那就得用 `alter table user drop index name;` 来删。

### 4. 默认值

```sql
-- 加默认值
alter table user alter column status set default '1';

-- 删默认值
alter table user alter column status drop default;
```

### 5. 检查

```sql
-- 加检查，起名 chk_user_age
alter table user add constraint chk_user_age check (age > 0 && age < 120);

-- 删检查
alter table user drop check chk_user_age;
```

建表时没起名字的检查约束，MySQL 会自动叫 `user_chk_1` 这种名字，先 `show create table user;` 看一眼实际叫什么，再删。

### 6. 外键

对应项目里的 `02.约束操作\外键约束.sql`，`dept` 是部门表，`emp` 是员工表，员工表的 `dept_id` 指向部门表的 `id`：

```sql
-- 加外键
alter table emp add constraint fk_emp_dept_id
    foreign key (dept_id) references dept(id);

-- 删外键
alter table emp drop foreign key fk_emp_dept_id;
```

加外键前要满足三个条件，否则加不上：`emp.dept_id` 和 `dept.id` 的类型完全一样；`dept.id` 是主键（或唯一）；`emp` 里已经存在的 `dept_id` 在 `dept` 里都查得到。

外键删除后，它顺手建的那个索引还在，想清干净就再来一句：

```sql
alter table emp drop index fk_emp_dept_id;
```

---

## 四、建表的时候直接把外键写好

项目脚本里外键是建完表再 `alter table` 补的，其实建表时就能一起写完。外键要写在**所有字段的最后面**（表级），不能像 `not null` 那样直接跟在字段后面：

```sql
-- 1. 先建父表 dept（被引用的表要先存在）
create table dept(
    id int auto_increment comment 'ID' primary key,
    name varchar(50) not null comment '部门名称'
) comment '部门表';

-- 2. 再建子表 emp，最后一行写外键
create table emp(
    id int primary key auto_increment comment '员工ID',
    name varchar(50) not null comment '姓名',
    dept_id int comment '部门ID',

    constraint fk_emp_dept_id
        foreign key (dept_id) references dept(id)
) comment '员工表';
```

几个要注意的地方：

* **建表顺序不能反**：`emp` 引用了 `dept`，所以 `dept` 必须先建，否则找不到要引用的表。
* **外键名字可以自己起**：`constraint fk_emp_dept_id` 这行不写也行，MySQL 会自动命名，但后面删外键时得先查它叫什么，不如自己起。
* **删除 / 更新行为也能在建表时写**：直接接在 `references dept(id)` 后面，比如 `references dept(id) on delete cascade`。
* **效果和 `alter table` 补外键完全一样**，区别只是写的时机：一个是建表时一次性写全，一个是表建好后单独加。
* **插数据也要按顺序**：先插 `dept`，再插 `emp`；给 `emp.dept_id` 填一个 `dept` 里没有的 id，会插不进去。

---

## 五、进阶一点点：外键的删除和更新行为

对应项目里的 `02.约束操作\外键删除更新行为.sql`。

不加任何设置时，外键默认是 `restrict`：部门里还有员工，就不许删这个部门，也不许改它的 `id`。想让它自动处理，就在 `references dept(id)` 后面加两句——`on update` 管"改部门 id 时怎么办"，`on delete` 管"删部门时怎么办"：

```sql
-- 第一种：级联
alter table emp
add constraint fk_emp_dept_id              -- 约束名字，方便以后删
foreign key (dept_id)                      -- emp 里的外键列
references dept(id)                        -- 引用 dept 的 id
on update cascade                          -- 改 dept.id，员工的 dept_id 跟着改
on delete cascade;                         -- 删部门，这个部门的员工一起删掉
```

```sql
-- 第二种：置空
alter table emp
add constraint fk_emp_dept_id
foreign key (dept_id)
references dept(id)
on update set null                         -- 改 dept.id，员工的 dept_id 变成 null
on delete set null;                        -- 删部门，员工留着，dept_id 变成 null
```

三种行为对比：

| 写法 | 删部门时 | 改部门 id 时 |
| :--- | :--- | :--- |
| 不写（默认 `restrict`） | 部门里还有员工就报错，删不掉 | 同样报错，改不了 |
| `cascade` | 员工跟着一起删 | 员工的 `dept_id` 跟着改 |
| `set null` | 员工留着，`dept_id` 变成 `null` | 同左 |

两个小提醒：

* `set null` 要求这一列允许为空。`emp.dept_id` 建表时没写 `not null`，所以能用；如果写了 `not null`，就会报错。
* 项目脚本里两段 `alter` 用的是同一个约束名 `fk_emp_dept_id`，实际演示时只能留一个：想从 `cascade` 换成 `set null`，先 `alter table emp drop foreign key fk_emp_dept_id;` 删掉，再加新的。

`cascade` 是连锁反应，删一个部门可能带走一批员工，删之前先 `select * from emp where dept_id = 要删的id;` 看一眼。

---

## 六、几个容易踩的坑

* **`unique` 允许重复的空值**：可以插好几条 `name` 为 `null` 的记录（前提是没加 `not null`）。
* **给已有数据的表加约束，先看数据合不合规**：表里已经有重名的，`add unique` 会失败；已经有年龄超范围的，`add check` 也会失败。先把不合规的旧数据改掉或删掉。
* **有外键的两张表，删表要先删子表**：先删 `emp`，再删 `dept`；对 `dept` 直接 `truncate` 也会被外键拦住。

---

## 七、复习用：六种约束关键字速查

| 约束 | 关键字 | 怎么加（以项目表为例） | 怎么删 |
| :--- | :--- | :--- | :--- |
| 非空 | `not null` | 建表时 `name varchar(10) not null`，或 `alter table user modify name varchar(10) not null;` | `alter table user modify name varchar(10) null;` |
| 唯一 | `unique` | 建表时 `name varchar(10) unique`，或 `alter table user add constraint uk_name unique (name);` | `alter table user drop index uk_name;` |
| 主键 | `primary key`（常配 `auto_increment`） | 建表时 `id int primary key auto_increment`，或 `alter table user add primary key (id);` | `alter table user drop primary key;`（带自增要先 `modify id int`） |
| 默认 | `default` | 建表时 `status char(1) default '1'`，或 `alter table user alter column status set default '1';` | `alter table user alter column status drop default;` |
| 检查 | `check` | 建表时 `age int check (age > 0 && age < 120)`，或 `alter table user add constraint chk_user_age check (age > 0 && age < 120);` | `alter table user drop check chk_user_age;` |
| 外键 | `foreign key ... references` | 建表最后一行写，或 `alter table emp add constraint fk_emp_dept_id foreign key (dept_id) references dept(id);` | `alter table emp drop foreign key fk_emp_dept_id;` |

记不住的时候抓两条规律：

* 写在字段后面的：`not null`、`unique`、`default`、`check`、`primary key`；外键例外，只能写在所有字段最后。
* 删的时候只有主键、唯一、检查、外键能直接 `drop`；非空和默认值没有 `drop` 语法，是用 `modify` / `alter column` 把这一列改成"没有约束"的样子。
</script>
<script type="text/plain" data-doc="09">
# MySQL 多表查询学习笔记

> **一句话理解**：多表查询就是把有关系的几张表拼成一张大表来查。拼的时候必须告诉数据库"这两张表按哪个字段对上"，不然每条数据和每条数据两两组合，结果会炸成一大片无意义的行（这就是笛卡尔积）。

---

## 一、先认识项目里的两张老表：`dept` 和 `emp`

多表查询的脚本都在 `itheima` 库上跑，用的就是约束那一章建好的两张表：

* `dept`（部门表）：`id`、`name`，一共 5 条——1 研发部、2 市场部、3 财务部、4 销售部、5 总经办。
* `emp`（员工表）：`id`、`name`、`age`、`job`、`salary`、`entrydate`、`managerid`（直属上级的 id）、`dept_id`（所在部门 id）。

对应项目里的 `03.多表查询\03_多表查询具体实现.sql`，正式查询前先把数据换成"金庸那个版本"：

```sql
use itheima;

-- 部门表补一个 6 号部门
insert into dept(id, name) values (6, '人事部');

-- 员工表清空重插，一共 17 个人
truncate table emp;
insert into emp (id, name, age, job, salary, entrydate, managerid, dept_id) values
(1,  '金庸',   66, '总裁',         20000.00, '2000-01-01', null, 5),
(2,  '张无忌', 20, '项目经理',     12500.00, '2005-12-05', 1,    1),
(3,  '杨逍',   33, '开发',          8400.00, '2000-11-03', 2,    1),
-- 中间省略
(17, '陈友谅', 42, null,            2000.00, '2011-10-12', 1,    null);
```

这批数据埋了两个"坑"，后面的外连接正好用得上：

* **金庸没有上级**，他的 `managerid` 是 `null`（老板嘛）。
* **陈友谅没有部门**，他的 `dept_id` 是 `null`。

另外要记住：部门表现在有 6 个，但**人事部（6 号）一个人都没招**，这也是后面演示用的。

---

## 二、建表时就要想清楚：两张表是什么关系

`01`、`02` 两个脚本演示的是"建表阶段"的关系，库换成了 `itheima_01`。关系无非三种：

| 关系 | 长什么样 | 项目里的例子 |
| :--- | :--- | :--- |
| 一对多 | 一个部门有多个员工，员工只属于一个部门 | `dept` 对 `emp`，员工表里存 `dept_id` |
| 一对一 | 一个用户只有一份教育信息 | `tb_user` 对 `tb_user_edu`，靠 `unique` 卡住 |
| 多对多 | 一个学生选多门课，一门课被多个学生选 | `student` 和 `course`，靠中间表 `student_course` |

### 1. 多对多：必须有一张中间表

`01_多表关系演示-多对多.sql` 里建了三张表：

```sql
-- 学生表
create table student(
    id int auto_increment primary key comment '主键id',
    name varchar(50) comment '姓名',
    no varchar(10) comment '学号'
) comment '学生表';

-- 课程表
create table course(
    id int auto_increment primary key comment '主键id',
    name varchar(50) comment '课程名称'
) comment '课程表';

-- 中间表：只干一件事，记录"谁选了哪门课"
create table student_course(
    id int auto_increment comment '主键' primary key,
    studentId int not null comment '学生id',
    courseId int not null comment '课程id',
    constraint fk_courseid foreign key (courseId) references course(id),
    constraint fk_studentid foreign key (studentId) references student(id)
) comment '学生课程中间表';
```

为什么不能直接在 `student` 里加一列"课程"？

* 一个学生选了 3 门课，这一列就得存 `'java,python,c++'` 这种一坨字符串，查"谁选了 java"只能靠模糊匹配，根本没法建外键。
* 中间表把一对多拆成两条一对多：`student` 对中间表是一对多，`course` 对中间表也是一对多。以后要查"张伟选了什么课"，三张表连起来就行。

插入顺序也有讲究：先插 `student` 和 `course`，再插中间表，因为中间表的两列都是外键：

```sql
insert into student_course(studentid, courseid) values
    (1,1),(1,2),
    (1,3),(2,2),
    (2,3),(3,4);
```

读法就是：1 号学生（张伟）选了 1、2、3 号课，2 号学生（李娜）选了 2、3 号课，3 号学生（王强）选了 4 号课。

### 2. 一对一：靠 `unique` 卡住

`02_多表关系演示-一对一.sql` 里 `tb_user` 存基本信息，`tb_user_edu` 存教育信息，靠 `user_id` 关联。但光有外键只是"一对多"——一个用户可以对应好几句教育信息。

```sql
-- 给 user_id 加唯一约束，一个用户就只能有一条教育信息了
alter table tb_user_edu add unique (user_id);

-- 手机号也顺手加上，一个手机号只能属于一个用户
alter table tb_user add unique (phone);
```

**一对一和一对多的区别就在这个 `unique` 上**：大家都是外键，加了唯一才是"一对一"。

---

## 三、笛卡尔积：多表查询第一个要打的怪

`03_多表查询具体实现.sql` 里第一句就是故意写错的：

```sql
select * from dept, emp;
```

没写连接条件，数据库就按"每一条部门 × 每一条员工"全部组合一遍。6 个部门 × 17 个员工 = **102 行**，里面绝大多数都是"研发部 + 财务部的张无忌"这种不存在的组合。

要消灭它，加上连接条件就行——`emp.dept_id` 等于 `dept.id`，意思是"这个员工属于这个部门"：

```sql
select * from emp, dept where emp.dept_id = dept.id order by emp.id;
```

这时结果变成 16 行。为什么不是 17 行？因为陈友谅的 `dept_id` 是 `null`，对不上任何部门，被这条条件筛掉了。

**规律**：N 张表连接，至少要写 N-1 个连接条件，条件通常就是"子表的外键 = 父表的主键"。

---

## 四、内连接：只要两边都对得上的

`04_多表查询内连接.sql` 演示了两种写法，效果完全一样，只是写法不同。

### 1. 隐式内连接（用逗号 + `where`）

```sql
-- 查询每一个员工的姓名，以及他所在部门的名称
select emp.name '员工姓名', dept.name '部门名称'
from emp, dept
where emp.dept_id = dept.id;
```

这就是上一节消灭笛卡尔积的写法，`from` 后面用逗号隔开两张表，条件全塞 `where` 里。好处是顺手，坏处是表一多，`where` 里连接条件和过滤条件混在一起，看着乱。

### 2. 显式内连接（`inner join ... on`）

```sql
select e.name, d.name
from emp e inner join dept d on e.dept_id = d.id;
```

* `inner` 可以省略，直接写 `join` 就是内连接。
* `on` 后面专门写**连接条件**，逻辑上是"先拼表"，拼完再用 `where` 过滤，两者分开了，比隐式清楚。
* `emp e` 是给表起别名。**起了别名之后，前面 `select` 里就不能再写 `emp.name` 了，必须写 `e.name`**，脚本里特意注释了这一点。

内连接的结果就是"两边都能对上"的部分。所以陈友谅（没部门）和人事部（没员工）都不会出现。

---

## 五、外连接：某一方的数据全都要留着

`05_多表查询外连接.sql`。内连接会丢数据，外连接就是"以我为主，另一边能配上就配，配不上就留空"。

### 1. 左外连接（`left join`）

**左表（`from` 后面那张）的数据一条不丢**，去右表找匹配，找不到的右表字段填 `null`。

```sql
-- 查询 emp 表的所有数据，和对应部门的信息
select emp.*, dept.name from emp left join dept on emp.dept_id = dept.id;
```

跑出来是 **17 行**：16 个有部门的正常显示，陈友谅也留着，只是他的"部门名称"显示为 `null`。写 `dept.name` 而不是 `dept.*`，是因为部门表的 `id` 和员工表的 `id` 重名，选出来两列都叫 `id`，不好认。

### 2. 右外连接（`right join`）

**右表的数据一条不丢**，左表匹配不上的填 `null`：

```sql
select dept.*, emp.* from emp right join dept on emp.dept_id = dept.id;
```

这次同样是 **17 行**，但内容不一样：16 个有部门的员工正常显示，再加上人事部这一条孤零零的部门（员工那一侧全是 `null`）。陈友谅却没在里面——右外连接只保证右表不丢数据，他匹配不到任何部门，照样被扔掉了。

**一句话对比**：左外连接丢"没部门的员工"，右外连接丢"没员工的部门"，看你想保哪一头。

**日常习惯**：想要哪张表的数据全留着，就把那张表放左边、用 `left join`。这样所有查询都是 `left join`，不用一会儿左一会儿右地换脑子。脚本注释里也说了，`outer` 这个词纯属废话，写不写都行。

---

## 六、自连接：一张表自己连自己

`06_多表查询自连接.sql`。`emp` 表里每行都有 `managerid` 指向本表的 `id`——上级也是员工，存在同一张表里。要查"员工叫啥、他领导叫啥"，就得把 `emp` 当成两张表用，**必须起两个不同的别名**：

```sql
-- 查员工和所属领导的名字（领导查不到的不显示）
select
    e.name as '员工姓名',
    m.name as '所属领导姓名'
from emp e
join emp m on e.managerid = m.id;
```

`e` 代表"作为员工的自己"，`m` 代表"作为领导的自己"。`e.managerid = m.id` 就是"我的上级 id 等于某个人的 id"。

这句是内连接，所以**金庸不会出现**（他是总裁，`managerid` 是 `null`，对不上任何人），结果 16 行。要把老板也查出来，换 `left join`：

```sql
select
    A.name as '员工姓名',
    B.name as '所属领导姓名'
from emp A
left join emp B on A.managerid = B.id;
```

这样 17 个人全在，金庸的"所属领导姓名"是 `null`。

**判断要不要自连接**：一张表里有一列"存的是本表另一个人的 id"，比如员工的上级、评论的父评论、分类的父分类。

---

## 七、联合查询（`union` / `union all`）

`07_联合查询.sql`。前面几种都是**左右拼列**，`union` 是**上下拼行**——把两个查询的结果摞成一张表。

脚本里的需求：把"工资低于 5000 的"和"年龄大于 50 的"都查出来。

```sql
-- union all：直接摞起来，不去重
select * from emp where salary < 5000
union all
select * from emp where age > 50;

-- union：摞起来之后去掉完全重复的行
select * from emp where salary < 5000
union
select * from emp where age > 50;
```

按项目里的数据算一下：

* 工资低于 5000 的 3 个人：鹿杖客 3750、鹤笔翁 3750、陈友谅 2000。
* 年龄大于 50 的 4 个人：金庸 66、灭绝 60、鹿杖客 56、张三丰 88。
* 鹿杖客两边都占，所以 `union all` 是 3 + 4 = **7 行**，`union` 去掉重复的鹿杖客，是 **6 行**。

两条规则：

* **上下两个 `select` 的列数必须一样，列的类型也要对得上**，不然 MySQL 直接报错。脚本里两边都用 `select *`，天然一致。
* 结果集的列名以**第一个 `select`** 为准。
* 能不去重就不去重，`union all` 少一步排序去重，快一些。

---

## 八、子查询：`select` 里再套一个 `select`

`08_子查询.sql`。把一条查询的结果，当成另一条查询的条件或一张临时表。

判断属于哪一类，就看**括号里的 `select` 返回几行几列**：

| 类型 | 返回什么 | 用在哪 | 常用符号 |
| :--- | :--- | :--- | :--- |
| 标量子查询 | 1 行 1 列（一个值） | `where` 里当值用 | `=` `>` `<` |
| 列子查询 | 多行 1 列（一列值） | `where` 里当一堆值用 | `in` `not in` `any` `some` `all` |
| 行子查询 | 1 行多列 | 几个字段一起比 | `(a, b) = (...)` |
| 表子查询 | 多行多列 | 放在 `from` 后面当表用 | `in`、起别名后 `join` |

### 1. 标量子查询：括号里只出一个值

```sql
-- 分两步想：先查出销售部的 id，再用这个 id 去查员工
select id from dept where name = '销售部';      -- 结果是 4
select * from emp where dept_id = 4;

-- 合成一句话
select * from emp where dept_id = (select id from dept where name = '销售部');
```

```sql
-- 查方东白入职之后入职的员工是谁
select * from emp where entrydate > (select entrydate from emp where name = '方东白');
```

括号里的查询只会返回一个值（一个 id、一个日期），所以外面用 `=`、`>` 这种比较符号就行。**如果括号里返回好几行，用 `=` 会报错**，那时候就该换 `in` 了。

### 2. 列子查询：括号里出一列值

```sql
-- 1. 查销售部和市场部的所有员工
select * from emp where dept_id in (select id from dept where name = '销售部' or name = '市场部');
```

`in` 后面括号里可能是 `4, 2` 这样的多个值，意思是"等于其中任意一个"。

```sql
-- 2. 比财务部所有员工工资都高的人
select * from emp where salary > all (select salary from emp where dept_id = (select id from dept where name = '财务部'));
```

财务部三个人的工资是 8500、48000、5250，`> all` 就是"比最大的 48000 还大"。项目数据里没人超过 48000，所以这句查出来是空结果——`all` 就是这么严。

```sql
-- 3. 比研发部任意一人工资高的人
select * from emp where salary > any (select salary from emp where dept_id = (select id from dept where name = '研发部'));
```

研发部最低是 6600，`> any` 就是"比最小的 6600 大就算"，范围一下宽很多。`some` 和 `any` 完全等价，写哪个都行。

记法：**`all` 全部满足（比最大的还大），`any` 任意一个满足（比最小的大）**。

注意这两句里 `from emp where dept_id = (...)` 又套了一层，这种"子查询里还有子查询"是允许的，从最里面往外读就行。

### 3. 行子查询：一行几个字段一起比

```sql
-- 查和张无忌工资、直属领导都一样的员工
select * from emp where (salary, managerid) = (select salary, managerid from emp where name = '张无忌');
```

括号里返回 `(12500, 2)` 这样一对值，外面的 `(salary, managerid)` 也是一个括号，两边对应着比，**必须个数和顺序都一致**。如果拆成 `salary = (...) and managerid = (...)` 写两个子查询也能出结果，但行子查询一句话搞定。

### 4. 表子查询：把查询结果当一张表用

```sql
-- 查和鹿杖客、宋远桥职位和薪资都相同的人
select * from emp where (job, salary) in (select job, salary from emp where name in ('鹿杖客', '宋远桥'));
```

括号里返回两行多列，用 `=` 不可能对得上，所以改成 `in`：只要我的 `(职位, 薪资)` 和其中某一行的组合一样，就算命中。

```sql
-- 查 2006-01-01 之后入职的员工，以及他们的部门信息
select * from (select * from emp where entrydate > '2006-01-01') e
left join dept on e.dept_id = dept.id;
```

括号里的查询结果被当成一张临时表，**起个别名 `e` 才能用**，然后拿它去 `left join` 部门表。这种写法适合"先把大表筛小，再和其他表连"，比在 `join ... on` 里塞一堆条件更直观。这里用 `left join`，是为了让没部门的陈友谅也留下来（他 2011 年入职，正好符合这个日期条件，不留下就查无此人了）。

---

## 九、几个容易踩的坑

* **忘写连接条件，直接出笛卡尔积**：`select * from dept, emp;` 102 行，看着能跑，其实全是垃圾数据。表越多越恐怖，三张 100 行的表能出 100 万行。
* **起了别名就不能再用原表名**：`select emp.name from emp e ...` 会报错"Unknown column"，一律改写成 `e.name`。
* **`left join` 里过滤右表，条件要放 `on` 里**：想查"所有员工 + 研发部的名称"，如果写 `where dept.name = '研发部'`，陈友谅和别的部门的人会被整行删掉，`left join` 就退化成 `inner join` 了。写在 `on` 后面才是"只影响右表匹配，左表该留的还留"。
* **子查询返回多行却用 `=`**：`where salary = (select salary from emp ...)` 一旦括号里出两行就报错，先想清楚它到底返回一行还是多行。
* **`union` 两边列数不一致**：`select id, name` 配 `select name` 会直接报错，因为没法对齐。
* **一对一漏了 `unique`**：只加外键只是"一对多"，`tb_user_edu` 里同一个 `user_id` 能插好几条。
* **中间表漏了外键**：多对多中间表的两个列都要能被父表约束住，不然会插进"不存在的学生选了不存在的课"。

---

## 十、复习用：多表查询关键字速查

| 类型 | 关键字 / 写法 | 项目里的例子 | 结果特点 |
| :--- | :--- | :--- | :--- |
| 笛卡尔积 | `from 表1, 表2`（无连接条件） | `select * from dept, emp;` | 6 × 17 = 102 行垃圾数据 |
| 隐式内连接 | `from 表1, 表2 where 连接条件` | `select emp.name, dept.name from emp, dept where emp.dept_id = dept.id;` | 只留两边都对得上的，16 行 |
| 显式内连接 | `表1 join 表2 on 连接条件` | `select e.name, d.name from emp e join dept d on e.dept_id = d.id;` | 和隐式一样，16 行 |
| 左外连接 | `表1 left join 表2 on 连接条件` | `select emp.*, dept.name from emp left join dept on emp.dept_id = dept.id;` | 左表全留，陈友谅的部门为 `null`，17 行 |
| 右外连接 | `表1 right join 表2 on 连接条件` | `select dept.*, emp.* from emp right join dept on emp.dept_id = dept.id;` | 右表全留，人事部员工为 `null` |
| 自连接 | `表1 a join 表1 b on 条件` | `select A.name, B.name from emp A left join emp B on A.managerid = B.id;` | 员工和上级，金庸的上级为 `null` |
| 联合查询 | `union` / `union all` | `select * from emp where salary < 5000 union select * from emp where age > 50;` | 上下拼行，`union` 去重、`union all` 不去重 |
| 标量子查询 | `where 字段 = (子查询)` | `where dept_id = (select id from dept where name = '销售部')` | 子查询出一个值 |
| 列子查询 | `where 字段 in / any / all (子查询)` | `where dept_id in (select id from dept where name = '销售部' or name = '市场部')` | 子查询出一列值 |
| 行子查询 | `where (字段1, 字段2) = (子查询)` | `where (salary, managerid) = (select salary, managerid from emp where name = '张无忌')` | 子查询出一行多列 |
| 表子查询 | `from (子查询) 别名` | `from (select * from emp where entrydate > '2006-01-01') e left join dept ...` | 子查询当临时表 |

记不住时抓三条主线：

* **左右拼列**用 `join`：要交集选 `inner join`，要某一方的全部选 `left join` / `right join`。
* **上下拼行**用 `union`，两边列数必须一样。
* **条件里套查询**用子查询，括号返回一个值就用 `=`，返回一列就用 `in`，返回一张表就放到 `from` 后面起别名。
</script>

  <script>
    /* ======================== 0. 元数据 ======================== */
    const DOCS = [
      { id: '01', title: 'DDL：数据定义', desc: '建库建表、加列改列、删表清空——先把结构搭起来，再谈往里放数据。', tags: ['CREATE TABLE', 'ALTER', 'DROP', '索引'] },
      { id: '02', title: 'DML：数据操作', desc: '单行与多行新增、按条件改和删，以及忘写 WHERE 的代价。', tags: ['INSERT', 'UPDATE', 'DELETE', 'NULL'] },
      { id: '03', title: 'DQL：数据查询', desc: '条件、聚合、分组、排序、分页，一条 SELECT 的完整套路与真实执行顺序。', tags: ['SELECT', 'GROUP BY', 'HAVING', 'LIMIT'] },
      { id: '04', title: 'DCL：数据控制', desc: '建账号、授权限、收权限，谁能连库、能看哪张表都在这里定。', tags: ['GRANT', 'REVOKE', '账号'] },
      { id: '05', title: '进阶补充', desc: '前四篇没展开的部分：引擎字符集、写入形态、窗口函数、角色权限。', tags: ['视图', '窗口函数', '角色', 'CHECK'] },
      { id: '06', title: '数据库函数操作', desc: '字符串、数值、日期、流程控制，把值加工成想要的样子，再决定落不落库。', tags: ['字符串函数', '日期函数', 'CASE', '聚合'] },
      { id: '07', title: '数据库事务', desc: 'ACID、脏读幻读、四种隔离级别——转账不能只做一半。', tags: ['ACID', '隔离级别', 'COMMIT', 'ROLLBACK'] },
      { id: '08', title: '数据库约束操作', desc: '主键、非空、唯一、默认、检查、外键，六条规矩把坏数据挡在门外。', tags: ['主键', '外键', 'UNIQUE', 'CHECK'] },
      { id: '09', title: '数据库多表查询', desc: '内外连接、自连接、联合查询与四种子查询，把几张表拼成一张来查。', tags: ['JOIN', 'UNION', '子查询', '笛卡尔积'] }
    ];

    /* 笔记原文：来自页面内 <script type="text/plain"> 块，渲染时转成卡片式章节 */
    const SRC = {};
    document.querySelectorAll('script[data-doc]').forEach(el => {
      SRC[el.dataset.doc] = el.textContent;
    });

    const CACHE = {};
    let current = null;

    /* ======================== 1. 文本工具 ======================== */
    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function codeSpan(s) {
      return s.split('`').map((part, i) =>
        i % 2 ? `<code>${esc(part)}</code>` : esc(part)
      ).join('');
    }

    function inline(s) {
      let out = '', i = 0, m;
      const re = /`([^`]+)`|\*\*([\s\S]+?)\*\*|\[([^\]]+)\]\(([^)\s]+)\)/g;
      while ((m = re.exec(s)) !== null) {
        out += esc(s.slice(i, m.index));
        if (m[1] !== undefined) {
          out += `<code>${esc(m[1])}</code>`;
        } else if (m[2] !== undefined) {
          out += `<strong>${codeSpan(m[2])}</strong>`;
        } else {
          const jump = /^(?:\.\/)?(\d{2})[-.][^\/]*\.md$/.exec(m[4]);
          out += jump && SRC[jump[1]]
            ? `<a href="#/${jump[1]}">${esc(m[3])}</a>`
            : `<a href="${esc(m[4])}" target="_blank" rel="noopener">${esc(m[3])}</a>`;
        }
        i = m.index + m[0].length;
      }
      return out + esc(s.slice(i));
    }

    function isCJK(ch) { return /[\u4e00-\u9fa5\u3000-\u303f\uff00-\uffef]/.test(ch); }

    function joinPara(lines) {
      let s = lines[0] || '';
      for (let k = 1; k < lines.length; k++) {
        const prev = s.charAt(s.length - 1), next = lines[k].charAt(0);
        s += (isCJK(prev) && isCJK(next) ? '' : ' ') + lines[k];
      }
      return s;
    }

    function plain(s) { return s.replace(/`/g, '').replace(/\*\*/g, ''); }

    /* ======================== 2. SQL 语法高亮 ======================== */
    const KW = new Set(('select from where insert into values update set delete create table database schema if not exists ' +
      'default character set use alter add column modify change drop truncate index on primary key unique ' +
      'foreign references constraint and or is null like in between order by group having desc asc limit ' +
      'offset distinct as join inner left right cross outer union all any some case when then else end ' +
      'show tables grants grant revoke to user identified account lock unlock privileges flush role view ' +
      'replace interval day month year hour minute second begin start transaction commit rollback savepoint ' +
      'explain engine convert collate cascade restrict check comment auto_increment unsigned signed int ' +
      'integer bigint tinyint smallint varchar char decimal float double enum date datetime timestamp time ' +
      'text blob over partition true false').split(' '));

    function highlight(src) {
      const re = /(--[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/)|('(?:[^'\\]|\\.|'')*')|("(?:[^"\\]|\\.)*")|(`[^`]*`)|(\b\d+(?:\.\d+)?\b)|(@@?[A-Za-z0-9_.]+)|([A-Za-z_][A-Za-z0-9_$]*)|([\s\S])/g;
      let out = '', m;
      while ((m = re.exec(src)) !== null) {
        if (m[1] !== undefined) out += `<span class="cmt">${esc(m[1])}</span>`;
        else if (m[2] !== undefined) out += `<span class="str">${esc(m[2])}</span>`;
        else if (m[3] !== undefined) out += `<span class="str">${esc(m[3])}</span>`;
        else if (m[4] !== undefined) out += `<span class="str">${esc(m[4])}</span>`;
        else if (m[5] !== undefined) out += `<span class="num">${esc(m[5])}</span>`;
        else if (m[6] !== undefined) out += `<span class="kw">${esc(m[6])}</span>`;
        else if (m[7] !== undefined) {
          if (KW.has(m[7].toLowerCase())) out += `<span class="kw">${esc(m[7])}</span>`;
          else if (/^\s*\(/.test(src.slice(re.lastIndex))) out += `<span class="fn">${esc(m[7])}</span>`;
          else out += esc(m[7]);
        } else out += esc(m[8]);
      }
      return out;
    }

    /* ======================== 3. Markdown → 卡片式章节 ======================== */
    function codeBlock(raw, lang) {
      const l = (lang || 'text').toLowerCase();
      const body = (l === 'sql' || l === 'mysql') ? highlight(raw) : esc(raw);
      return `<div class="code-block">
        <div class="code-head"><span>${esc(l === 'mysql' ? 'sql' : l)}</span><button class="copy-btn" type="button">复制</button></div>
        <pre><code>${body}</code></pre>
      </div>`;
    }

    function splitRow(line) {
      return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
    }

    function tableHTML(head, rows) {
      let out = '<div class="table-wrap"><table><thead><tr>';
      head.forEach(c => { out += `<th>${inline(c)}</th>`; });
      out += '</tr></thead><tbody>';
      rows.forEach(r => {
        out += '<tr>';
        for (let j = 0; j < head.length; j++) out += `<td>${inline(r[j] || '')}</td>`;
        out += '</tr>';
      });
      return out + '</tbody></table></div>';
    }

    /* 引用块 → 提示框（按关键词自动配色） */
    function calloutHTML(text) {
      let title = '', body = text, cls = 'callout';
      const m = /^\*\*(.+?)\*\*\s*[：:]?\s*/.exec(text);
      if (m) {
        title = plain(m[1]).replace(/[：:]$/, '');
        body = text.slice(m[0].length);
        if (/注意|坑|风险|危险|小心/.test(title)) cls += ' warn';
        else if (/理解|记忆|核心|目的/.test(title)) cls += ' good';
        else if (/进阶|原理|补充|延伸/.test(title)) cls += ' deep';
        else if (/禁止|不要/.test(title)) cls += ' danger';
      }
      return `<div class="${cls}">${title ? `<span class="callout-title">${esc(title)}</span>` : ''}${inline(body)}</div>`;
    }

    /* 补充说明 → 带标签的浅底提示 */
    function hintHTML(text) {
      const m = /^\*\*(.+?)\*\*\s*[：:]?\s*/.exec(text);
      if (!m) return `<p class="hint">${inline(text)}</p>`;
      const label = plain(m[1]).replace(/[：:]$/, '');
      return `<p class="hint"><span class="hint-label">${esc(label)}</span>${inline(text.slice(m[0].length))}</p>`;
    }

    function renderDoc(id) {
      const meta = DOCS.find(d => d.id === id);
      const lines = SRC[id].replace(/\r\n?/g, '\n').split('\n');
      const nav = [];
      let intro = [], body = [], html = '', chNum = 0, i = 0;

      const flushChapter = () => {
        if (!body.length) return;
        const item = nav[nav.length - 1];
        html += `<section class="chapter" id="${item.id}">
          <div class="chapter-header">
            <span class="chapter-badge">${item.num}</span>
            <h2>${item.html}</h2>
          </div>
          ${body.join('')}
        </section>`;
        body = [];
      };

      while (i < lines.length) {
        const line = lines[i];
        let m;

        /* 代码块 */
        if (/^```/.test(line)) {
          const lang = line.slice(3).trim() || 'text';
          const buf = [];
          i++;
          while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
          i++;
          (chNum ? body : intro).push(codeBlock(buf.join('\n'), lang));
          continue;
        }

        /* 表格 */
        if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|?\s*$/.test(lines[i + 1])) {
          const head = splitRow(line), rows = [];
          i += 2;
          while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(splitRow(lines[i])); i++; }
          (chNum ? body : intro).push(tableHTML(head, rows));
          continue;
        }

        /* 标题 */
        if ((m = /^(#{1,4})\s+(.*)$/.exec(line))) {
          const level = m[1].length, text = m[2].trim();
          if (level === 2) {
            flushChapter();
            chNum++;
            nav.push({ id: `sec-${chNum}`, num: String(chNum).padStart(2, '0'), html: inline(text), plain: plain(text) });
          } else if (level === 3 || level === 4) {
            (chNum ? body : intro).push(`<h${level}>${inline(text)}</h${level}>`);
          }
          i++;
          continue;
        }

        if (/^-{3,}\s*$/.test(line)) { i++; continue; }
        if (/^\s*$/.test(line)) { i++; continue; }

        /* 引用 → 提示框 */
        if (/^>\s?/.test(line)) {
          const bq = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) { bq.push(lines[i].replace(/^>\s?/, '')); i++; }
          (chNum ? body : intro).push(calloutHTML(bq.join(' ')));
          continue;
        }

        /* 补充说明 */
        if (/^~\s+/.test(line)) {
          (chNum ? body : intro).push(hintHTML(line.replace(/^~\s+/, '')));
          i++;
          continue;
        }

        /* 无序列表 */
        if (/^[-*]\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^[-*]\s+/.test(lines[i])) { items.push(lines[i].replace(/^[-*]\s+/, '')); i++; }
          (chNum ? body : intro).push(`<ul>${items.map(t => `<li>${inline(t)}</li>`).join('')}</ul>`);
          continue;
        }

        /* 有序列表 */
        if (/^\d+\.\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\d+\.\s+/.test(lines[i])) { items.push(lines[i].replace(/^\d+\.\s+/, '')); i++; }
          (chNum ? body : intro).push(`<ol>${items.map(t => `<li>${inline(t)}</li>`).join('')}</ol>`);
          continue;
        }

        /* 普通段落 */
        const para = [];
        while (i < lines.length && !isBlockStart(lines[i])) { para.push(lines[i].trim()); i++; }
        if (!para.length) { i++; continue; }
        (chNum ? body : intro).push(`<p>${inline(joinPara(para))}</p>`);
      }
      flushChapter();

      let out = `<header class="hero" data-mark="${meta.id}">
        <div class="hero-tags">${meta.tags.map(t => `<span class="hero-tag">${esc(t)}</span>`).join('')}</div>
        <h1>${esc(meta.title)}</h1>
        <p>${esc(meta.desc)}</p>
      </header>`;

      if (intro.length) out += `<section class="chapter">${intro.join('')}</section>`;
      out += html;
      out += '<footer class="doc-footer">本篇内容与同目录原始笔记一致 · 按 Ctrl + P 可导出 PDF</footer>';

      return { html: out, nav };
    }

    function isBlockStart(t) {
      return /^\s*$/.test(t) || /^#{1,4}\s/.test(t) || /^```/.test(t) || /^>\s?/.test(t) ||
        /^~\s+/.test(t) || /^[-*]\s+/.test(t) || /^\d+\.\s+/.test(t) ||
        /^\s*\|/.test(t) || /^-{3,}\s*$/.test(t);
    }

    /* ======================== 4. 首页卡片墙 ======================== */
    document.getElementById('card-grid').innerHTML = DOCS.map(d => `
      <a class="entry-card" href="#/${d.id}">
        <div class="entry-top">
          <span class="entry-num">${d.id}</span>
          <span class="entry-go">→</span>
        </div>
        <h3>${esc(d.title)}</h3>
        <p>${esc(d.desc)}</p>
        <div class="entry-tags">${d.tags.map(t => `<span class="pill blue">${esc(t)}</span>`).join('')}</div>
      </a>
    `).join('');

    /* ======================== 5. 视图切换 ======================== */
    const viewHome = document.getElementById('view-home');
    const viewReader = document.getElementById('view-reader');
    const docBody = document.getElementById('doc-body');
    const navList = document.getElementById('nav-list');
    const sidebar = document.getElementById('sidebar');

    function closeSidebar() { sidebar.classList.remove('open'); }

    function showHome() {
      current = null;
      viewReader.hidden = true;
      viewHome.hidden = false;
      document.title = 'MySQL 数据库操作笔记 · 九篇合集';
      window.scrollTo(0, 0);
      updateProgress();
    }

    function showDoc(id) {
      const meta = DOCS.find(d => d.id === id);
      if (!meta) return showHome();
      const data = CACHE[id] || (CACHE[id] = renderDoc(id));

      current = id;
      document.getElementById('brand-num').textContent = id;
      document.getElementById('brand-title').textContent = meta.title;
      document.getElementById('brand-sub').textContent = `9 篇 · 第 ${id} 篇 · 共 ${data.nav.length} 节`;
      document.getElementById('mobile-title').textContent = meta.title;
      document.title = `${meta.title} | MySQL 数据库操作笔记`;

      docBody.innerHTML = data.html;
      navList.innerHTML = data.nav.map((n, k) => `
        <li><a href="#${n.id}" data-target="${n.id}"${k === 0 ? ' class="active"' : ''}>
          <span class="nav-num">${n.id.replace('sec-', '')}</span>${esc(n.plain)}
        </a></li>
      `).join('');

      closeSidebar();
      viewHome.hidden = true;
      viewReader.hidden = false;
      window.scrollTo(0, 0);
      updateProgress();
      highlightNav();
    }

    function route() {
      const hash = location.hash;
      const m = /^#\/(\d{2})$/.exec(hash);
      if (m && SRC[m[1]]) {
        if (current !== m[1]) showDoc(m[1]);
        return;
      }
      if (!hash || hash === '#' || hash === '#/') showHome();
    }

    window.addEventListener('hashchange', route);

    /* ======================== 6. 目录点击 / 代码复制 / 主题 ======================== */
    document.addEventListener('click', e => {
      const navLink = e.target.closest('#nav-list a');
      if (navLink) {
        e.preventDefault();
        const target = document.getElementById(navLink.dataset.target);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        navLink.classList.add('active');
        closeSidebar();
        return;
      }

      const copyBtn = e.target.closest('.copy-btn');
      if (copyBtn) { copyCode(copyBtn); return; }

      if (e.target.closest('[data-theme-toggle]')) { toggleTheme(); return; }
    });

    function copyCode(btn) {
      const text = btn.closest('.code-block').querySelector('pre').textContent;
      const done = ok => {
        const old = btn.textContent;
        btn.textContent = ok ? '已复制 ✓' : '请手动复制';
        btn.classList.toggle('done', ok);
        setTimeout(() => { btn.textContent = old; btn.classList.remove('done'); }, 1600);
      };

      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      document.body.removeChild(ta);

      if (ok) done(true);
      else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => done(true), () => done(false));
      } else done(false);
    }

    /* 默认即 One Dark，data-theme="light" 时切到 One Light */
    function syncThemeButtons() {
      const light = document.documentElement.getAttribute('data-theme') === 'light';
      document.querySelectorAll('[data-theme-toggle]').forEach(btn => {
        btn.textContent = light ? '切换到深色' : '切换到浅色';
      });
    }

    function toggleTheme() {
      const root = document.documentElement;
      const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('mysql_ops_notes_theme', next); } catch (e) {}
      syncThemeButtons();
    }

    function initTheme() {
      try {
        if (localStorage.getItem('mysql_ops_notes_theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
      syncThemeButtons();
    }

    /* ======================== 7. 阅读进度与目录高亮 ======================== */
    function updateProgress() {
      const bar = document.getElementById('reading-progress');
      if (!current) { bar.style.width = '0%'; return; }
      const top = window.scrollY;
      const height = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = (height > 0 ? Math.min(100, (top / height) * 100) : 0) + '%';
    }

    function highlightNav() {
      if (!current) return;
      const sections = docBody.querySelectorAll('section.chapter[id]');
      if (!sections.length) return;
      let activeId = sections[0].id;
      sections.forEach(sec => {
        if (sec.getBoundingClientRect().top <= 130) activeId = sec.id;
      });
      navList.querySelectorAll('a').forEach(a => {
        a.classList.toggle('active', a.dataset.target === activeId);
      });
    }

    function onScroll() {
      updateProgress();
      highlightNav();
    }

    window.addEventListener('scroll', onScroll, { passive: true });

    function toggleSidebar() {
      sidebar.classList.toggle('open');
    }

    /* ======================== 8. 初始化 ======================== */
    initTheme();
    route();
    updateProgress();
  </script>
</body>
</html>
